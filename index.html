// Converte un elemento SVG in PNG dataURL (Promise)
function svgToPng(svgEl, width, height) {
  return new Promise(function(resolve, reject) {
    if (!svgEl) { reject('no svg'); return; }
    try {
      // Clono il nodo per evitare di modificare quello in pagina
      var clone = svgEl.cloneNode(true);
      // Forzo xmlns su tutti i livelli (alcuni browser richiedono questi attributi per il blob SVG)
      if (!clone.getAttribute('xmlns')) clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      if (!clone.getAttribute('xmlns:xlink')) clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
      
      var svgData = new XMLSerializer().serializeToString(clone);
      // Aggiungo XML declaration esplicita
      svgData = '<?xml version="1.0" encoding="UTF-8"?>\n' + svgData;
      
      var canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      var img = new Image();
      img.crossOrigin = 'anonymous';
      var svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      var url = URL.createObjectURL(svgBlob);
      
      img.onload = function() {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        try {
          resolve(canvas.toDataURL('image/png'));
        } catch (e) {
          reject('canvas tainted: ' + e);
        }
      };
      img.onerror = function(e) { 
        URL.revokeObjectURL(url); 
        console.warn('svgToPng image load error', e);
        reject('img error'); 
      };
      img.src = url;
    } catch (e) { 
      console.warn('svgToPng exception', e);
      reject(e); 
    }
  });
}

// Esporta un PDF unico con due sezioni:
// Sezione A: il periodo attualmente selezionato (es. Luglio, Q3, ecc.)
// Sezione B: YTD (dall'inizio anno) come avanzamento complessivo
function exportMultiPeriodoPdf() {
  if (!lastReport) return;
  var r = lastReport;
  
  // Se il periodo corrente è già YTD, non ha senso — avvisa l'utente
  if (r.periodo.mode === 'YTD') {
    alert('Il periodo corrente è già YTD.\nSeleziona un mese o trimestre specifico, poi clicca "PDF Multi-periodo" per ottenere il PDF con quel periodo + YTD affiancati.');
    return;
  }
  
  // Calcola i dati per entrambi i periodi
  var dati = r.dati; // già filtrati per agente (o tutti per Italia)
  var anno = r.anno;
  var annoP = r.annoP;
  
  // Periodo A: quello corrente (mese/trimestre selezionato)
  var periodoA = r.periodo;
  
  // Periodo B: YTD (ricalcola il giornoMax dal dataset)
  var maxMese = 0, maxGiorno = 0;
  for (var i = 0; i < D.length; i++) {
    if (D[i].anno === anno) {
      if (D[i].mese > maxMese || (D[i].mese === maxMese && D[i].giorno > maxGiorno)) {
        maxMese = D[i].mese; maxGiorno = D[i].giorno;
      }
    }
  }
  if (maxMese === 0) maxMese = 12;
  var periodoB = {
    mode: 'YTD', da: 1, a: maxMese, giornoMax: maxGiorno || 31,
    label: 'YTD (1 gen - ' + maxGiorno + ' ' + meseNome(maxMese).toLowerCase() + ')'
  };
  
  // Calcola i 4 dataset (2 periodi × 2 anni)
  var dA26 = calcolaDati(dati, anno, periodoA);
  var dA25 = calcolaDati(dati, annoP, periodoA);
  var dB26 = calcolaDati(dati, anno, periodoB);
  var dB25 = calcolaDati(dati, annoP, periodoB);
  
  var refsA26 = calcolaReferenze(dA26.vendite), refsA25 = calcolaReferenze(dA25.vendite);
  var refsB26 = calcolaReferenze(dB26.vendite), refsB25 = calcolaReferenze(dB25.vendite);
  
  // Prepara lista items per entrambi i periodi
  function buildItems(d26, d25) {
    var isItalia = r.isItalia;
    if (isItalia) {
      var ag26 = {}, ag25 = {};
      for (var i = 0; i < d26.vendite.length; i++) {
        var v = d26.vendite[i]; if (!v.agente || !isRigaFatturato(v)) continue;
        if (!ag26[v.agente]) ag26[v.agente] = { fatt: 0, btlEq: 0, clienti: {} };
        ag26[v.agente].fatt += v.importo;
        if (isRigaBottiglia(v)) ag26[v.agente].btlEq += v.pezziEq;
        ag26[v.agente].clienti[v.cliente] = true;
      }
      for (var i = 0; i < d25.vendite.length; i++) {
        var v = d25.vendite[i]; if (!v.agente || !isRigaFatturato(v)) continue;
        if (!ag25[v.agente]) ag25[v.agente] = { fatt: 0, btlEq: 0, clienti: {} };
        ag25[v.agente].fatt += v.importo;
        if (isRigaBottiglia(v)) ag25[v.agente].btlEq += v.pezziEq;
        ag25[v.agente].clienti[v.cliente] = true;
      }
      var all = {}; Object.keys(ag26).forEach(function(k){all[k]=1;}); Object.keys(ag25).forEach(function(k){all[k]=1;});
      return Object.keys(all).sort().map(function(a) {
        var a6 = ag26[a] || {fatt:0,btlEq:0,clienti:{}}; var a5 = ag25[a] || {fatt:0,btlEq:0,clienti:{}};
        return { nome: a, f26: a6.fatt, f25: a5.fatt, b26Eq: a6.btlEq, b25Eq: a5.btlEq,
                 pm26: PM(a6.fatt, a6.btlEq), nClienti26: Object.keys(a6.clienti).length };
      });
    } else {
      var all = {}; Object.keys(d26.clienti).forEach(function(k){all[k]=1;}); Object.keys(d25.clienti).forEach(function(k){all[k]=1;});
      return Object.keys(all).sort().map(function(c) {
        var c6 = d26.clienti[c] || {fatt:0,btl:0,btlEq:0}; var c5 = d25.clienti[c] || {fatt:0,btl:0,btlEq:0};
        return { nome: c, f26: c6.fatt, f25: c5.fatt, b26Eq: c6.btlEq, b25Eq: c5.btlEq, pm26: PM(c6.fatt, c6.btlEq), agente: c6.agente || '', citta: c6.citta || '' };
      });
    }
  }
  
  var itemsA = buildItems(dA26, dA25);
  var itemsB = buildItems(dB26, dB25);
  
  // Fix 2 — Ordine clienti:
  // itemsA: usa l'ordine DOM (l'utente l'ha impostato cliccando le colonne nella schermata principale)
  var domOrdinati = readTableOrder('main-tbl', lastReport.tutti);
  var domNomi = domOrdinati.map(function(x) { return x.nome; });
  itemsA.sort(function(a, b) {
    var ia = domNomi.indexOf(a.nome);
    var ib = domNomi.indexOf(b.nome);
    if (ia === -1 && ib === -1) return b.f26 - a.f26;
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
  // itemsB (YTD): ordina per variazione EUR crescente = perdite maggiori in cima
  // (stesso criterio "fatturato perso crescente" che l'utente applica nell'interfaccia)
  itemsB.sort(function(a, b) {
    var deltaA = a.f26 - a.f25;
    var deltaB = b.f26 - b.f25;
    return deltaA - deltaB; // ascending: più negativo prima
  });
  
  // ============ COSTRUZIONE PDF ============
  var doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  var pageW = 297, pageH = 210, margin = 14;
  var isItalia = r.isItalia;
  var entityLbl = isItalia ? 'agenti' : 'clienti';
  
  // Helper: disegna una sezione completa nel multi-periodo PDF
  // trendData: { t26, t25, da, a } oppure null (non mostra tabella mensile)
  function disegnaSezione(doc, d26, d25, items, refs26, refs25, periodo, yStart, trendData) {
    var y = yStart;
    
    drawSectionTitle(doc, periodo.label, margin, y);
    y += 6;
    
    // KPI + tabella riassuntiva clienti (layout affiancato, come main PDF)
    var halfW = 148;
    var dF  = d25.fatturato   > 0 ? ((d26.fatturato   - d25.fatturato)   / d25.fatturato)   * 100 : 0;
    var dB  = d25.bottiglieEq > 0 ? ((d26.bottiglieEq - d25.bottiglieEq) / d25.bottiglieEq) * 100 : 0;
    var dPM = d25.pm          > 0 ? ((d26.pm           - d25.pm)          / d25.pm)          * 100 : 0;
    var dOrd = d25.ordini     > 0 ? ((d26.ordini       - d25.ordini)      / d25.ordini)      * 100 : 0;
    
    // KPI — sinistra
    doc.autoTable({
      head: [['', anno.toString(), annoP.toString(), 'Var', 'Var %']],
      body: [
        ['Fatturato',    EURpdf(d26.fatturato),   EURpdf(d25.fatturato),   EURsignPdf(d26.fatturato-d25.fatturato),     PCTsign(dF)],
        ['Bottiglie',    NUM(d26.bottiglieEq),     NUM(d25.bottiglieEq),    NUMsign(d26.bottiglieEq-d25.bottiglieEq),   PCTsign(dB)],
        ['Prezzo Medio', EURpdf(d26.pm),           EURpdf(d25.pm),          EURsignPdf(d26.pm-d25.pm),                  PCTsign(dPM)],
        ['Ordini',       NUM(d26.ordini),          NUM(d25.ordini),         NUMsign(d26.ordini-d25.ordini),             PCTsign(dOrd)]
      ],
      startY: y, theme: 'striped',
      headStyles: { fillColor: [114, 47, 55], textColor: 255, fontSize: 8 },
      bodyStyles: { fontSize: 8 },
      columnStyles: { 0:{fontStyle:'bold'}, 1:{halign:'right'}, 2:{halign:'right'}, 3:{halign:'right'}, 4:{halign:'right'} },
      margin: { top: 32, left: margin, right: pageW - margin - halfW },
      didParseCell: colorNegativesCallback,
      tableWidth: halfW
    });
    var yKpiEnd = doc.lastAutoTable.finalY;
    
    // Tabella riassuntiva clienti — destra (affiancata ai KPI)
    var sNuovi=0, sCrescita=0, sCalo=0, sPersi=0;
    var sDeltaNuovi=0, sDeltaCrescita=0, sDeltaCalo=0, sDeltaPersi=0;
    for (var i = 0; i < items.length; i++) {
      var ci = items[i];
      if      (ci.f26>0 && ci.f25===0)              { sNuovi++;    sDeltaNuovi    += ci.f26; }
      else if (ci.f26>0 && ci.f25>0 && ci.f26>=ci.f25){ sCrescita++; sDeltaCrescita += ci.f26-ci.f25; }
      else if (ci.f26>0 && ci.f25>0 && ci.f26< ci.f25){ sCalo++;    sDeltaCalo     += ci.f26-ci.f25; }
      else if (ci.f26===0 && ci.f25>0)               { sPersi++;   sDeltaPersi    -= ci.f25; }
    }
    doc.autoTable({
      head: [['Clienti', 'N.', 'Var EUR']],
      body: [
        [isItalia ? 'Tutti gli agenti' : 'Tutti i clienti', items.length, EURsignPdf(sDeltaNuovi+sDeltaCrescita+sDeltaCalo+sDeltaPersi)],
        ['  Nuovi',        sNuovi,    EURsignPdf(sDeltaNuovi)],
        ['  In crescita',  sCrescita, EURsignPdf(sDeltaCrescita)],
        ['  In calo',      sCalo,     EURsignPdf(sDeltaCalo)],
        ['  Senza ordini', sPersi,    EURsignPdf(sDeltaPersi)]
      ],
      startY: y, theme: 'striped',
      headStyles: { fillColor: [114, 47, 55], textColor: 255, fontSize: 8 },
      bodyStyles: { fontSize: 8 },
      columnStyles: { 0:{fontStyle:'bold'}, 1:{halign:'right'}, 2:{halign:'right'} },
      margin: { top: 32, left: margin + halfW + 4, right: margin },
      didParseCell: colorNegativesCallback,
      tableWidth: pageW - 2*margin - halfW - 4
    });
    var yBlocksEnd = doc.lastAutoTable.finalY;
    y = Math.max(yKpiEnd, yBlocksEnd) + 6;
    
    // Tabella valori mensili (solo se trendData fornito — tipicamente per sezione YTD)
    if (trendData) {
      if (y > 160) { doc.addPage('a4','landscape'); drawHeader(doc, {vista:r.vista,anno:anno,annoP:annoP,periodo:periodo}, pageW); y = 32; }
      drawSectionTitle(doc, 'Andamento mensile fatturato', margin, y);
      y += 5;
      var mAbbrArr = ['','Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
      function fmtTrend(v) {
        if (!v || v===0) return '—';
        if (v>=1000000) return (v/1000000).toFixed(1).replace('.',',')+' M';
        if (v>=1000) return (v/1000).toFixed(1).replace('.',',')+' k';
        return Math.round(v).toString();
      }
      var headM = [''], row26M = [anno+''], row25M = [annoP+''];
      for (var m = trendData.da; m <= trendData.a; m++) {
        headM.push(mAbbrArr[m]);
        row26M.push(fmtTrend(trendData.t26[m]||0));
        row25M.push(fmtTrend(trendData.t25[m]||0));
      }
      var colStyT = { 0: { fontStyle:'bold', fillColor:[245,240,240] } };
      for (var m = 1; m <= trendData.a - trendData.da + 1; m++) colStyT[m] = { halign:'center' };
      doc.autoTable({
        head: [headM], body: [row26M, row25M], startY: y,
        theme: 'grid',
        headStyles: { fillColor:[114,47,55], textColor:255, fontSize:7, halign:'center' },
        bodyStyles: { fontSize:8, cellPadding:1.5 },
        columnStyles: colStyT,
        margin: { top:32, left:margin, right:margin },
        didParseCell: function(data) {
          if (data.section==='body') {
            if (data.row.index===0) data.cell.styles.textColor=[114,47,55];
            if (data.row.index===1) data.cell.styles.textColor=[160,120,30];
            if (data.column.index===0) data.cell.styles.fontStyle='bold';
          }
        }
      });
      y = doc.lastAutoTable.finalY + 6;
    }
    
    // Referenze
    if (y > 160) { doc.addPage('a4','landscape'); drawHeader(doc, {vista:r.vista,anno:anno,annoP:annoP,periodo:periodo}, pageW); y = 32; }
    drawSectionTitle(doc, 'Rotazione referenze', margin, y);
    y += 4;
    var refRows = [];
    REFERENZE_NAMES.forEach(function(name) {
      var r26ref = refs26[name] || {fatt:0,btlEq:0}; var r25ref = refs25[name] || {fatt:0,btlEq:0};
      if (r26ref.btlEq===0 && r25ref.btlEq===0) return;
      var dRef = r25ref.btlEq>0 ? ((r26ref.btlEq-r25ref.btlEq)/r25ref.btlEq)*100 : 0;
      var pct = d26.bottiglieEq>0 ? (r26ref.btlEq/d26.bottiglieEq)*100 : 0;
      refRows.push([name, NUM(r26ref.btlEq), NUM(r25ref.btlEq), EURpdf(r26ref.fatt), pct.toFixed(1).replace('.',',')+' %', PCTsign(dRef)]);
    });
    doc.autoTable({
      head: [['Referenza', 'Bott.'+anno, 'Bott.'+annoP, 'Fatturato', '% tot', 'Var%']],
      body: refRows, startY: y, theme: 'striped',
      headStyles: { fillColor:[114,47,55], textColor:255, fontSize:7 },
      bodyStyles: { fontSize:7 },
      columnStyles: { 0:{fontStyle:'bold'}, 1:{halign:'right'}, 2:{halign:'right'}, 3:{halign:'right'}, 4:{halign:'right'}, 5:{halign:'right'} },
      margin: { top:32, left:margin, right:margin },
      didParseCell: colorNegativesCallback
    });
    y = doc.lastAutoTable.finalY + 6;
    
    // Formato sintetico
    var fmtD = calcolaFormati(d26.vendite);
    var fmtD25 = calcolaFormati(d25.vendite);
    var totBtlEq26f = 0;
    for (var i = 0; i < FORMATI_NAMES.length; i++) totBtlEq26f += fmtD.totali[FORMATI_NAMES[i]].btlEq;
    var fmtRows = [];
    for (var i = 0; i < FORMATI_NAMES.length; i++) {
      var fn = FORMATI_NAMES[i];
      var f6 = fmtD.totali[fn], f5 = fmtD25.totali[fn];
      if (f6.btl===0 && f5.btl===0) continue;
      var pctF = totBtlEq26f>0 ? (f6.btlEq/totBtlEq26f*100) : 0;
      var vF = f5.btlEq>0 ? ((f6.btlEq-f5.btlEq)/f5.btlEq*100) : 0;
      fmtRows.push([fn, NUM(f6.btl), pctF.toFixed(1).replace('.',',')+' %', NUM(f5.btl), PCTsign(vF)]);
    }
    if (fmtRows.length) {
      if (y > 160) { doc.addPage('a4','landscape'); drawHeader(doc, {vista:r.vista,anno:anno,annoP:annoP,periodo:periodo}, pageW); y = 32; }
      drawSectionTitle(doc, 'Vendite per formato', margin, y);
      y += 4;
      doc.autoTable({
        head: [['Formato', 'Bott. '+anno, '% tot', 'Bott. '+annoP, 'Var%']],
        body: fmtRows, startY: y, theme: 'striped',
        headStyles: { fillColor:[114,47,55], textColor:255, fontSize:7 },
        bodyStyles: { fontSize:7 },
        columnStyles: { 0:{fontStyle:'bold'}, 1:{halign:'right'}, 2:{halign:'right'}, 3:{halign:'right'}, 4:{halign:'right'} },
        margin: { top:32, left:margin, right:margin },
        didParseCell: colorNegativesCallback
      });
      y = doc.lastAutoTable.finalY + 6;
    }
    
    // Tabella clienti/agenti
    if (y > 150) { doc.addPage('a4','landscape'); drawHeader(doc, {vista:r.vista,anno:anno,annoP:annoP,periodo:periodo}, pageW); y = 32; }
    drawSectionTitle(doc, 'Elenco ' + entityLbl + ' (' + items.length + ')', margin, y);
    y += 4;
    
    var totF26=0, totF25=0, totB26=0, totB25=0;
    var body = items.map(function(c) {
      var varP = c.f25>0 ? ((c.f26-c.f25)/c.f25)*100 : (c.f26>0?100:-100);
      totF26+=c.f26; totF25+=c.f25; totB26+=c.b26Eq||0; totB25+=c.b25Eq||0;
      if (isItalia) return [c.nome, c.nClienti26||0, EURpdf(c.f26), EURpdf(c.f25), EURsignPdf(c.f26-c.f25), PCTsign(varP), NUM(c.b26Eq||0), NUM(c.b25Eq||0), EURpdf(c.pm26)];
      return [c.nome, c.citta||'', c.agente, EURpdf(c.f26), EURpdf(c.f25), EURsignPdf(c.f26-c.f25), PCTsign(varP), NUM(c.b26Eq||0), NUM(c.b25Eq||0), EURpdf(c.pm26)];
    });
    var totDF = totF25>0 ? ((totF26-totF25)/totF25)*100 : 0;
    if (isItalia) body.push(['TOTALE','',EURpdf(totF26),EURpdf(totF25),EURsignPdf(totF26-totF25),PCTsign(totDF),NUM(totB26),NUM(totB25),EURpdf(PM(totF26,totB26))]);
    else body.push(['TOTALE','','',EURpdf(totF26),EURpdf(totF25),EURsignPdf(totF26-totF25),PCTsign(totDF),NUM(totB26),NUM(totB25),EURpdf(PM(totF26,totB26))]);
    
    var heads = isItalia
      ? [['Agente','Clienti','Fatt.'+anno,'Fatt.'+annoP,'Var EUR','Var %','Bott.'+anno,'Bott.'+annoP,'PM']]
      : [['Cliente','Citta','Agente','Fatt.'+anno,'Fatt.'+annoP,'Var EUR','Var %','Bott.'+anno,'Bott.'+annoP,'PM']];
    var cS = isItalia
      ? {1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'},7:{halign:'right'},8:{halign:'right'}}
      : {3:{halign:'right'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'},7:{halign:'right'},8:{halign:'right'},9:{halign:'right'}};
    
    doc.autoTable({
      head: heads, body: body, startY: y,
      theme: 'striped',
      headStyles: { fillColor: [114, 47, 55], textColor: 255, fontSize: 7 },
      bodyStyles: { fontSize: 6.5 },
      columnStyles: cS,
      styles: { cellPadding: 1.2 },
      margin: { top: 32, left: margin, right: margin },
      didParseCell: function(data) {
        colorNegativesCallback(data);
        if (data.section==='body' && data.row.index===body.length-1) {
          data.cell.styles.fontStyle='bold'; data.cell.styles.fillColor=[240,230,230];
        }
      },
      didDrawPage: function(data) {
        // Ridisegna l'header bordeaux su ogni pagina di overflow
        // data.pageNumber > 1 significa che siamo su una pagina aggiuntiva
        drawHeader(doc, {vista:r.vista, anno:anno, annoP:annoP, periodo:periodo}, pageW);
        // Su pagine di overflow aggiungi anche il titolo sezione in piccolo
        if (data.pageNumber > 1) {
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(8);
          doc.setTextColor(201, 168, 76);
          doc.text('(continua) ' + periodo.label, margin, 29);
        }
      }
    });
  }
  
  // Calcola trend YTD per la tabella mensile della sezione 2
  var ytdTrend26 = calcolaTrendMensile(r.dati, anno, periodoB);
  var ytdTrend25 = calcolaTrendMensile(r.dati, annoP, periodoB);
  
  // ============ PAGINA 1+: SEZIONE A — PERIODO SELEZIONATO ============
  var rFakeA = { vista: r.vista, anno: anno, annoP: annoP, periodo: periodoA };
  drawHeader(doc, rFakeA, pageW);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  doc.setTextColor(201, 168, 76);
  doc.text('SEZIONE 1 — ' + periodoA.label.toUpperCase(), margin, 29);
  // Sezione A: nessuna tabella trend (singolo mese non ha senso come grafico)
  disegnaSezione(doc, dA26, dA25, itemsA, refsA26, refsA25, periodoA, 34, null);
  
  // ============ NUOVA PAGINA: SEZIONE B — YTD ============
  doc.addPage('a4', 'landscape');
  var rFakeB = { vista: r.vista, anno: anno, annoP: annoP, periodo: periodoB };
  drawHeader(doc, rFakeB, pageW);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  doc.setTextColor(201, 168, 76);
  doc.text('SEZIONE 2 — AVANZAMENTO ' + periodoB.label.toUpperCase(), margin, 29);
  // Sezione B (YTD): passa la tabella mensile
  disegnaSezione(doc, dB26, dB25, itemsB, refsB26, refsB25, periodoB, 34,
    { t26: ytdTrend26, t25: ytdTrend25, da: periodoB.da, a: periodoB.a });
  
  // ============ FOOTER PAGINATO ============
  addPageNumbers(doc, pageW, pageH);
  
  var nomeFile = 'Mosnel_' + r.vista.replace(/\s+/g,'_') + '_' + periodoA.label.replace(/\s+/g,'_') + '+YTD_' + anno + '.pdf';
  doc.save(nomeFile);
}

function exportReportPdf() {
  if (!lastReport) return;
  var r = lastReport;
  // Tutto in LANDSCAPE A4 per layout uniforme professionale
  var doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  var pageW = 297, pageH = 210;
  var margin = 14;
  
  // ============ PAGINA 1: HEADER + KPI + GRAFICO ============
  drawHeader(doc, r, pageW);
  
  var y = 36;
  
  // KPI + 4 blocchi affiancati (sinistra: KPI, destra: blocchi)
  var dF = r.d25.fatturato > 0 ? ((r.d26.fatturato - r.d25.fatturato) / r.d25.fatturato) * 100 : 0;
  var dB = r.d25.bottiglieEq > 0 ? ((r.d26.bottiglieEq - r.d25.bottiglieEq) / r.d25.bottiglieEq) * 100 : 0;
  var dPM = r.d25.pm > 0 ? ((r.d26.pm - r.d25.pm) / r.d25.pm) * 100 : 0;
  
  // Calcolo blocchi
  var totDeltaCalo = 0, totDeltaCrescita = 0, totDeltaNuovi = 0, totDeltaPersi = 0;
  for (var i = 0; i < r.calo.length; i++) totDeltaCalo += (r.calo[i].f26 - r.calo[i].f25);
  for (var i = 0; i < r.crescita.length; i++) totDeltaCrescita += (r.crescita[i].f26 - r.crescita[i].f25);
  for (var i = 0; i < r.nuovi.length; i++) totDeltaNuovi += r.nuovi[i].f26;
  for (var i = 0; i < r.persi.length; i++) totDeltaPersi -= r.persi[i].f25;
  
  var entityLbl = r.isItalia ? 'agenti' : 'clienti';
  var entityCap = r.isItalia ? 'Agenti' : 'Clienti';
  
  // Sezione superiore: KPI a sinistra (larghezza 140mm), Blocchi a destra (larghezza 125mm)
  var halfW = 140;
  
  // Titolo KPI
  drawSectionTitle(doc, 'Indicatori chiave', margin, y);
  // Titolo blocchi
  drawSectionTitle(doc, 'Riepilogo ' + entityLbl, margin + halfW + 4, y);
  y += 5;
  
  // Tabella KPI (sinistra)
  doc.autoTable({
    head: [['', r.anno.toString(), r.annoP.toString(), 'Var', 'Var %']],
    body: [
      ['Fatturato', EURpdf(r.d26.fatturato), EURpdf(r.d25.fatturato), EURsignPdf(r.d26.fatturato-r.d25.fatturato), PCTsign(dF)],
      ['Bottiglie', NUM(r.d26.bottiglieEq), NUM(r.d25.bottiglieEq), NUMsign(r.d26.bottiglieEq-r.d25.bottiglieEq), PCTsign(dB)],
      ['Prezzo Medio', EURpdf(r.d26.pm), EURpdf(r.d25.pm), EURsignPdf(r.d26.pm-r.d25.pm), PCTsign(dPM)],
      ['Ordini', NUM(r.d26.ordini), NUM(r.d25.ordini), NUMsign(r.d26.ordini-r.d25.ordini), '']
    ],
    startY: y,
    theme: 'striped',
    headStyles: { fillColor: [114, 47, 55], textColor: 255, fontSize: 9 },
    bodyStyles: { fontSize: 9 },
    columnStyles: { 0: { fontStyle: 'bold' }, 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' } },
    margin: { left: margin, right: pageW - margin - halfW },
    didParseCell: colorNegativesCallback,
    tableWidth: halfW
  });
  var yKpiEnd = doc.lastAutoTable.finalY;
  
  // Blocchi riepilogo PDF — universo corretto: tutti.length = portafoglio + persi
  var blocksBody;
  var totDeltaTotale = 0;
  for (var i = 0; i < r.tutti.length; i++) totDeltaTotale += (r.tutti[i].f26 - r.tutti[i].f25);
  
  if (r.isItalia) {
    var nClientiTotale = r.nClientiAttivi26 + r.nClientiPersi;
    blocksBody = [
      // AGENTI: universo = tutti (portafoglio + persi)
      ['Tutti gli agenti',    r.tutti.length,        EURsignPdf(totDeltaTotale)],
      ['  Nuovi',             r.nuovi.length,        EURsignPdf(totDeltaNuovi)],
      ['  In crescita',       r.crescita.length,     EURsignPdf(totDeltaCrescita)],
      ['  In calo',           r.calo.length,         EURsignPdf(totDeltaCalo)],
      ['  Senza ordini',      r.persi.length,        EURsignPdf(totDeltaPersi)],
      // CLIENTI
      ['Tutti i clienti',     nClientiTotale,        ''],
      ['  Nuovi',             r.nClientiNuovi,       ''],
      ['  In crescita',       r.nClientiCrescita,    ''],
      ['  In calo',           r.nClientiCalo,        ''],
      ['  Senza ordini',      r.nClientiPersi,       '']
    ];
  } else {
    // AGENTE: tutti i clienti = portafoglio + persi = r.tutti.length
    blocksBody = [
      ['Tutti i clienti',   r.tutti.length,       EURsignPdf(totDeltaTotale)],
      ['  Nuovi',           r.nuovi.length,       EURsignPdf(totDeltaNuovi)],
      ['  In crescita',     r.crescita.length,    EURsignPdf(totDeltaCrescita)],
      ['  In calo',         r.calo.length,        EURsignPdf(totDeltaCalo)],
      ['  Senza ordini',    r.persi.length,       EURsignPdf(totDeltaPersi)]
    ];
  }
  
  doc.autoTable({
    head: [['Categoria', 'N.', 'Var EUR']],
    body: blocksBody,
    startY: y,
    theme: 'striped',
    headStyles: { fillColor: [114, 47, 55], textColor: 255, fontSize: 9 },
    bodyStyles: { fontSize: 8 },
    columnStyles: { 0: { fontStyle: 'bold' }, 1: { halign: 'right' }, 2: { halign: 'right' } },
    margin: { left: margin + halfW + 4, right: margin },
    didParseCell: function(data) {
      colorNegativesCallback(data);
      // Righe "Tutti gli agenti" e "Tutti i clienti" in evidenza (bordeaux)
      if (data.section === 'body') {
        var raw = String(data.cell.raw || '');
        if (raw === 'Tutti gli agenti' || raw === 'Tutti i clienti') {
          data.cell.styles.fillColor = [114, 47, 55];
          data.cell.styles.textColor = [255, 255, 255];
          data.cell.styles.fontStyle = 'bold';
        }
      }
    },
    tableWidth: pageW - 2*margin - halfW - 4
  });
  var yBlocksEnd = doc.lastAutoTable.finalY;
  
  y = Math.max(yKpiEnd, yBlocksEnd) + 8;
  
  // Pre-converto chart + donut
  var chartSvg = document.querySelector('.chart-wrap svg');
  var donutSvg = document.querySelector('.donut-svg');
  
  var chartPromise = chartSvg ? svgToPng(chartSvg, 1600, 480) : Promise.resolve(null);
  var donutPromise = donutSvg ? svgToPng(donutSvg, 1150, 900) : Promise.resolve(null);
  
  Promise.all([chartPromise, donutPromise]).then(function(images) {
    var chartImg = images[0];
    var donutImg = images[1];
    
    // Grafico mensile a tutta larghezza (parte inferiore pagina 1)
    if (chartImg) {
      drawSectionTitle(doc, 'Andamento mensile fatturato', margin, y);
      y += 5;
      var availH = pageH - y - 40; // lasciamo spazio per la tabella valori
      var chartH = Math.min(availH, 58);
      doc.addImage(chartImg, 'PNG', margin, y, pageW - 2*margin, chartH);
      y += chartH + 2;
      
      // Tabella valori mensili sotto il grafico (2 righe: anno / annoP)
      var mesiDa = r.periodo.da, mesiA = r.periodo.a;
      var mAbbrArr = ['','Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
      
      // Funzione formato compatto
      function fmtPdf(v) {
        if (!v || v === 0) return '—';
        if (v >= 1000000) return (v/1000000).toFixed(1).replace('.',',') + 'M';
        if (v >= 1000) return (v/1000).toFixed(1).replace('.',',') + 'k';
        return Math.round(v).toString();
      }
      
      var headM = [''], row26M = [r.anno + ''], row25M = [r.annoP + ''];
      for (var m = mesiDa; m <= mesiA; m++) {
        headM.push(mAbbrArr[m]);
        row26M.push(fmtPdf(r.trend26[m] || 0));
        row25M.push(fmtPdf(r.trend25[m] || 0));
      }
      
      // Colstyles: tutte le colonne dati centrate (da 1 in poi)
      var colStyM = { 0: { fontStyle: 'bold', fillColor: [245, 240, 240] } };
      for (var m = 1; m <= mesiA - mesiDa + 1; m++) colStyM[m] = { halign: 'center' };
      
      doc.autoTable({
        head: [headM],
        body: [
          row26M.map(function(v, i) { return v; }),
          row25M.map(function(v, i) { return v; })
        ],
        startY: y,
        theme: 'grid',
        headStyles: { fillColor: [114, 47, 55], textColor: 255, fontSize: 7, halign: 'center' },
        bodyStyles: { fontSize: 7.5, cellPadding: 1.5 },
        columnStyles: colStyM,
        margin: { left: margin, right: margin },
        didParseCell: function(data) {
          if (data.section === 'body') {
            // Riga 2026: testo bordeaux
            if (data.row.index === 0) data.cell.styles.textColor = [114, 47, 55];
            // Riga 2025: testo oro
            if (data.row.index === 1) data.cell.styles.textColor = [160, 120, 30];
            // Prima colonna (etichetta anno): bold
            if (data.column.index === 0) data.cell.styles.fontStyle = 'bold';
          }
        }
      });
      y = doc.lastAutoTable.finalY + 2;
    }
    
    // ============ PAGINA 2: REFERENZE (DONUT + TABELLA AFFIANCATI) ============
    doc.addPage('a4', 'landscape');
    drawHeader(doc, r, pageW);
    var y2 = 36;
    
    drawSectionTitle(doc, 'Rotazione referenze ' + r.anno, margin, y2);
    y2 += 6;
    
    // Donut rettangolare con callout labels esterne
    var donutBoxW = 145;
    var donutBoxH = 110;
    var tableX = margin + donutBoxW + 6;
    var tableW = pageW - margin - tableX;
    
    if (donutImg) {
      doc.addImage(donutImg, 'PNG', margin, y2, donutBoxW, donutBoxH);
    }
    
    // Tabella referenze a destra del donut
    var refRows = [];
    var refNames = REFERENZE.map(function(x) { return x.name; });
    refNames.push('Altro');
    for (var i = 0; i < refNames.length; i++) {
      var name = refNames[i];
      var r26ref = r.refs26[name] || { fatt: 0, btl: 0, btlEq: 0 };
      var r25ref = r.refs25[name] || { fatt: 0, btl: 0, btlEq: 0 };
      if (r26ref.btlEq === 0 && r25ref.btlEq === 0) continue;
      var dRef = r25ref.btlEq > 0 ? ((r26ref.btlEq - r25ref.btlEq) / r25ref.btlEq) * 100 : 0;
      var pctTot = r.d26.bottiglieEq > 0 ? (r26ref.btlEq / r.d26.bottiglieEq) * 100 : 0;
      refRows.push([name, NUM(r26ref.btlEq), NUM(r25ref.btlEq), EURpdf(r26ref.fatt), pctTot.toFixed(2).replace('.', ',') + '%', PCTsign(dRef)]);
    }
    doc.autoTable({
      head: [['Referenza', 'Bott. ' + r.anno, 'Bott. ' + r.annoP, 'Fatturato', '% sul totale', 'Var %']],
      body: refRows, startY: y2,
      theme: 'striped',
      headStyles: { fillColor: [114, 47, 55], textColor: 255, fontSize: 9 },
      bodyStyles: { fontSize: 9 },
      columnStyles: { 0: { fontStyle: 'bold' }, 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' } },
      margin: { left: tableX, right: margin },
      didParseCell: colorNegativesCallback,
      tableWidth: tableW
    });
    
    // ============ PAGINA 3: VENDITE PER FORMATO ============
    addFormatiPage(doc, r, pageW, margin);
    
    // ============ PAGINA 4: TABELLA CLIENTI/AGENTI ============
    addClientiTablePage(doc, r, pageW, margin);
    
    // ============ FOOTER PAGINATO ============
    addPageNumbers(doc, pageW, pageH);
    
    doc.save('Mosnel_' + r.vista.replace(/\s+/g, '_') + '_' + r.anno + '.pdf');
  }).catch(function(err) {
    console.warn('Errore conversione SVG:', err);
    addFormatiPage(doc, r, pageW, margin);
    addClientiTablePage(doc, r, pageW, margin);
    addPageNumbers(doc, pageW, pageH);
    doc.save('Mosnel_' + r.vista.replace(/\s+/g, '_') + '_' + r.anno + '.pdf');
  });
}

// Header bordeaux uniforme per tutte le pagine PDF
function drawHeader(doc, r, pageW) {
  doc.setFillColor(114, 47, 55);
  doc.rect(0, 0, pageW, 24, 'F');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(15);
  doc.setTextColor(255, 255, 255);
  doc.text('Mosnel - ' + r.vista, 14, 12);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(201, 168, 76);
  doc.text(r.anno + ' vs ' + r.annoP + ' - ' + r.periodo.label, 14, 19);
}

// Titolo sezione con filetto bordeaux sottostante
function drawSectionTitle(doc, text, x, y) {
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.setTextColor(114, 47, 55);
  doc.text(text, x, y);
  doc.setDrawColor(201, 168, 76);
  doc.setLineWidth(0.5);
  var textW = doc.getTextWidth(text);
  doc.line(x, y + 1.2, x + textW, y + 1.2);
}

// Aggiunge la pagina "Vendite per formato": KPI cards + matrice referenza × formato
function addFormatiPage(doc, r, pageW, margin) {
  if (!r.fmt26 || !r.fmt25) return;
  
  doc.addPage('a4', 'landscape');
  drawHeader(doc, r, pageW);
  
  var y = 30;
  drawSectionTitle(doc, 'Vendite per formato ' + r.anno, margin, y);
  y += 6;
  
  // Calcola totali
  var totBtlEq26 = 0, totFatt26 = 0;
  for (var i = 0; i < FORMATI_NAMES.length; i++) {
    totBtlEq26 += r.fmt26.totali[FORMATI_NAMES[i]].btlEq;
    totFatt26 += r.fmt26.totali[FORMATI_NAMES[i]].fatt;
  }
  
  // Formati attivi (con vendite)
  var formatiAttivi = [];
  for (var i = 0; i < FORMATI_NAMES.length; i++) {
    var name = FORMATI_NAMES[i];
    if (r.fmt26.totali[name].btl > 0 || r.fmt25.totali[name].btl > 0) {
      formatiAttivi.push(name);
    }
  }
  
  // ============ TABELLA RIEPILOGO PER FORMATO ============
  var kpiBody = [];
  for (var i = 0; i < formatiAttivi.length; i++) {
    var name = formatiAttivi[i];
    var d26 = r.fmt26.totali[name];
    var d25 = r.fmt25.totali[name];
    var pctTot = totBtlEq26 > 0 ? (d26.btlEq / totBtlEq26) * 100 : 0;
    var dVar = d25.btlEq > 0 ? ((d26.btlEq - d25.btlEq) / d25.btlEq) * 100 : (d26.btlEq > 0 ? 100 : 0);
    kpiBody.push([
      name,
      NUM(d26.btl),
      NUM(d26.btlEq),
      pctTot.toFixed(1).replace('.', ',') + '%',
      EURpdf(d26.fatt),
      NUM(d25.btl),
      PCTsign(dVar)
    ]);
  }
  
  doc.autoTable({
    head: [['Formato', 'Bott. ' + r.anno, 'Eq. 0,75L ' + r.anno, '% sul totale', 'Fatturato', 'Bott. ' + r.annoP, 'Var % vs ' + r.annoP]],
    body: kpiBody, startY: y,
    theme: 'striped',
    headStyles: { fillColor: [114, 47, 55], textColor: 255, fontSize: 9 },
    bodyStyles: { fontSize: 9 },
    columnStyles: {
      0: { fontStyle: 'bold' },
      1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' },
      4: { halign: 'right' }, 5: { halign: 'right' }, 6: { halign: 'right' }
    },
    margin: { left: margin, right: margin },
    didParseCell: colorNegativesCallback
  });
  
  y = doc.lastAutoTable.finalY + 8;
  
  // ============ MATRICE REFERENZA × FORMATO ============
  drawSectionTitle(doc, 'Suddivisione formati per referenza (bottiglie effettive)', margin, y);
  y += 5;
  
  var refsArr = REFERENZE_NAMES.slice();
  refsArr.push('Altro');
  var matrixBody = [];
  
  for (var j = 0; j < refsArr.length; j++) {
    var ref = refsArr[j];
    var rData = r.fmt26.matrix[ref] || {};
    var hasData = false;
    var totRefEq = 0, totRefFatt = 0;
    var row = [ref];
    for (var i = 0; i < formatiAttivi.length; i++) {
      var d = rData[formatiAttivi[i]] || { btl: 0, btlEq: 0, fatt: 0 };
      if (d.btl > 0) hasData = true;
      totRefEq += d.btlEq;
      totRefFatt += d.fatt;
      row.push(d.btl > 0 ? NUM(d.btl) : '—');
    }
    row.push(NUM(totRefEq));
    row.push(EURpdf(totRefFatt));
    if (hasData) matrixBody.push(row);
  }
  
  // Riga totale
  var totRow = ['TOTALE'];
  for (var i = 0; i < formatiAttivi.length; i++) {
    totRow.push(NUM(r.fmt26.totali[formatiAttivi[i]].btl));
  }
  totRow.push(NUM(totBtlEq26));
  totRow.push(EURpdf(totFatt26));
  matrixBody.push(totRow);
  
  var head = ['Referenza'].concat(formatiAttivi).concat(['Totale eq.', 'Fatturato']);
  var colStyles = { 0: { fontStyle: 'bold' } };
  for (var i = 1; i < head.length; i++) colStyles[i] = { halign: 'right' };
  
  doc.autoTable({
    head: [head], body: matrixBody, startY: y,
    theme: 'striped',
    headStyles: { fillColor: [114, 47, 55], textColor: 255, fontSize: 8 },
    bodyStyles: { fontSize: 8 },
    columnStyles: colStyles,
    styles: { cellPadding: 1.8 },
    margin: { left: margin, right: margin },
    didParseCell: function(data) {
      // Riga TOTALE in grassetto
      if (data.section === 'body' && data.row.index === matrixBody.length - 1) {
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.fillColor = [240, 230, 230];
      }
    }
  });
}

// Aggiunge la pagina con la tabella clienti/agenti
function addClientiTablePage(doc, r, pageW, margin) {
  var orderedTutti = readTableOrder('main-tbl', r.tutti);
  if (!orderedTutti.length) return;
  
  doc.addPage('a4', 'landscape');
  drawHeader(doc, r, pageW);
  
  var y = 30;
  var entityLbl = r.isItalia ? 'agenti' : 'clienti';
  drawSectionTitle(doc, 'Elenco ' + entityLbl + ' (' + orderedTutti.length + ')', margin, y);
  y += 5;
  
  var totF26 = 0, totF25 = 0, totB26Eq = 0, totB25Eq = 0;
  var body = [];
  for (var i = 0; i < orderedTutti.length; i++) {
    var c = orderedTutti[i];
    var varP = c.f25 > 0 ? ((c.f26 - c.f25) / c.f25) * 100 : (c.f26 > 0 ? 100 : -100);
    if (r.isItalia) {
      body.push([c.nome, c.nClienti26 || 0, EURpdf(c.f26), EURpdf(c.f25), EURsignPdf(c.f26-c.f25), PCTsign(varP), NUM(c.b26Eq || 0), NUM(c.b25Eq || 0), EURpdf(c.pm26)]);
    } else {
      body.push([c.nome, c.citta || '', c.agente, EURpdf(c.f26), EURpdf(c.f25), EURsignPdf(c.f26-c.f25), PCTsign(varP), NUM(c.b26Eq || 0), NUM(c.b25Eq || 0), EURpdf(c.pm26)]);
    }
    totF26 += c.f26; totF25 += c.f25;
    totB26Eq += c.b26Eq || 0; totB25Eq += c.b25Eq || 0;
  }
  var totPM = PM(totF26, totB26Eq);
  var totDF = totF25 > 0 ? ((totF26 - totF25) / totF25) * 100 : 0;
  if (r.isItalia) {
    body.push(['TOTALE', '', EURpdf(totF26), EURpdf(totF25), EURsignPdf(totF26-totF25), PCTsign(totDF), NUM(totB26Eq), NUM(totB25Eq), EURpdf(totPM)]);
  } else {
    body.push(['TOTALE', '', '', EURpdf(totF26), EURpdf(totF25), EURsignPdf(totF26-totF25), PCTsign(totDF), NUM(totB26Eq), NUM(totB25Eq), EURpdf(totPM)]);
  }
  
  var heads = r.isItalia
    ? [['Agente', 'Clienti', 'Fatt. 2026', 'Fatt. 2025', 'Var EUR', 'Var %', 'Bott. 26', 'Bott. 25', 'PM 26']]
    : [['Cliente', 'Citta', 'Agente', 'Fatt. 2026', 'Fatt. 2025', 'Var EUR', 'Var %', 'Bott. 26', 'Bott. 25', 'PM 26']];
  
  var colStyles = r.isItalia
    ? { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' }, 6: { halign: 'right' }, 7: { halign: 'right' }, 8: { halign: 'right' } }
    : { 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' }, 6: { halign: 'right' }, 7: { halign: 'right' }, 8: { halign: 'right' }, 9: { halign: 'right' } };
  
  doc.autoTable({
    head: heads, body: body, startY: y,
    theme: 'striped',
    headStyles: { fillColor: [114, 47, 55], textColor: 255, fontSize: 8 },
    bodyStyles: { fontSize: 7 },
    columnStyles: colStyles,
    styles: { cellPadding: 1.5 },
    margin: { left: margin, right: margin },
    didParseCell: function(data) {
      colorNegativesCallback(data);
      if (data.section === 'body' && data.row.index === body.length - 1) {
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.fillColor = [240, 230, 230];
      }
    }
  });
}

// Numerazione pagine in basso a destra
function addPageNumbers(doc, pageW, pageH) {
  var n = doc.internal.getNumberOfPages();
  for (var i = 1; i <= n; i++) {
    doc.setPage(i);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text('Mosnel Sales Report  -  generato ' + new Date().toLocaleDateString('it-IT'), 14, pageH - 6);
    doc.text('Pagina ' + i + ' di ' + n, pageW - 14, pageH - 6, { align: 'right' });
  }
}


function saveXlsx(wb, name) {
  try { XLSX.writeFile(wb, name); }
  catch (e) {
    var o = XLSX.write(wb, {bookType:'xlsx', type:'binary'});
    var buf = new ArrayBuffer(o.length);
    var v = new Uint8Array(buf);
    for (var i = 0; i < o.length; i++) v[i] = o.charCodeAt(i) & 0xFF;
    var blob = new Blob([buf], {type:'application/octet-stream'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}
