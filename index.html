function buildDonutReferenze(r) {
  var refNames = REFERENZE.map(function(x) { return x.name; });
  refNames.push('Altro');
  
  // Colori per le referenze
  var COLORS = ['#722F37', '#C9A84C', '#8B5A3C', '#4A6FA5', '#7E9F3A', '#B47AAE', '#D88B4C', '#5C8A8A', '#A03333', '#6B4E71'];
  
  var items = [];
  var totalBtl = r.d26.bottiglieEq;
  
  for (var i = 0; i < refNames.length; i++) {
    var name = refNames[i];
    var r26 = r.refs26[name] || { fatt: 0, btl: 0, btlEq: 0 };
    var r25 = r.refs25[name] || { fatt: 0, btl: 0, btlEq: 0 };
    if (r26.btlEq === 0 && r25.btlEq === 0) continue;
    items.push({
      name: name,
      btlEq26: r26.btlEq,
      btlEq25: r25.btlEq,
      fatt26: r26.fatt,
      fatt25: r25.fatt,
      pctTot: totalBtl > 0 ? (r26.btlEq / totalBtl) * 100 : 0,
      dRef: r25.btlEq > 0 ? ((r26.btlEq - r25.btlEq) / r25.btlEq) * 100 : (r26.btlEq > 0 ? 100 : 0),
      color: COLORS[i % COLORS.length]
    });
  }
  
  items.sort(function(a, b) { return b.btlEq26 - a.btlEq26; });
  
  if (items.length === 0) return '<p style="color:var(--muted);font-size:12px">Nessun dato</p>';
  
  // Donut SVG con callout labels esterne L-shape (no overlap)
  // ViewBox 460x360 con donut centrato — più spazio verticale per le label
  var W = 460, H = 360;
  var cx = W / 2, cy = H / 2;
  var rOuter = 95, rInner = 58;
  var rLabelStart = rOuter + 4;
  
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="donut-svg" preserveAspectRatio="xMidYMid meet">';
  
  var startAngle = -90;
  var totalForDonut = 0;
  for (var i = 0; i < items.length; i++) totalForDonut += items[i].btlEq26;
  
  // Memorizzo info per le label da disegnare DOPO le fette
  var labelsToDraw = [];
  
  if (totalForDonut > 0) {
    for (var i = 0; i < items.length; i++) {
      var pct = items[i].btlEq26 / totalForDonut;
      var angle = pct * 360;
      var endAngle = startAngle + angle;
      var midAngle = startAngle + angle / 2;
      
      var startRad = (startAngle * Math.PI) / 180;
      var endRad = (endAngle * Math.PI) / 180;
      var midRad = (midAngle * Math.PI) / 180;
      
      var x1 = cx + rOuter * Math.cos(startRad);
      var y1 = cy + rOuter * Math.sin(startRad);
      var x2 = cx + rOuter * Math.cos(endRad);
      var y2 = cy + rOuter * Math.sin(endRad);
      var x3 = cx + rInner * Math.cos(endRad);
      var y3 = cy + rInner * Math.sin(endRad);
      var x4 = cx + rInner * Math.cos(startRad);
      var y4 = cy + rInner * Math.sin(startRad);
      
      var largeArc = angle > 180 ? 1 : 0;
      
      var path = 'M ' + x1 + ' ' + y1 +
                 ' A ' + rOuter + ' ' + rOuter + ' 0 ' + largeArc + ' 1 ' + x2 + ' ' + y2 +
                 ' L ' + x3 + ' ' + y3 +
                 ' A ' + rInner + ' ' + rInner + ' 0 ' + largeArc + ' 0 ' + x4 + ' ' + y4 +
                 ' Z';
      
      svg += '<path d="' + path + '" fill="' + items[i].color + '" stroke="white" stroke-width="1.5"/>';
      
      // Prepara label se fetta >= 0.5%
      var pctValue = pct * 100;
      if (pctValue >= 0.5) {
        // Punto di ancora: appena fuori dalla fetta (lungo il raggio midRad)
        var anchorX = cx + rLabelStart * Math.cos(midRad);
        var anchorY = cy + rLabelStart * Math.sin(midRad);
        var isRightSide = Math.cos(midRad) >= 0;
        
        labelsToDraw.push({
          anchorX: anchorX, anchorY: anchorY,
          labelY: anchorY, // sarà aggiustata dall'anti-collision
          isRight: isRightSide,
          color: items[i].color,
          name: items[i].name,
          pct: pctValue
        });
      }
      
      startAngle = endAngle;
    }
  }
  
  // Anti-collision bidirezionale: ordina per Y, poi sweep dall'alto in basso e dal basso in alto
  function antiCollide(labels, minGap, topY, bottomY) {
    if (labels.length === 0) return;
    // Ordina per anchorY (Y nativa della fetta)
    labels.sort(function(a, b) { return a.anchorY - b.anchorY; });
    // Pass 1: Y native
    for (var i = 0; i < labels.length; i++) labels[i].labelY = labels[i].anchorY;
    // Pass 2: top-down — se troppo vicino al precedente, sposta in giù
    for (var i = 1; i < labels.length; i++) {
      if (labels[i].labelY < labels[i-1].labelY + minGap) {
        labels[i].labelY = labels[i-1].labelY + minGap;
      }
    }
    // Pass 3: bottom-up — se l'ultima sfora il limite inferiore, comprimi verso l'alto
    if (labels[labels.length-1].labelY > bottomY) {
      labels[labels.length-1].labelY = bottomY;
      for (var i = labels.length - 2; i >= 0; i--) {
        if (labels[i].labelY > labels[i+1].labelY - minGap) {
          labels[i].labelY = labels[i+1].labelY - minGap;
        }
      }
    }
    // Pass 4: clamp top
    if (labels[0].labelY < topY) {
      labels[0].labelY = topY;
      for (var i = 1; i < labels.length; i++) {
        if (labels[i].labelY < labels[i-1].labelY + minGap) {
          labels[i].labelY = labels[i-1].labelY + minGap;
        }
      }
    }
  }
  
  var rightLabels = labelsToDraw.filter(function(l) { return l.isRight; });
  var leftLabels = labelsToDraw.filter(function(l) { return !l.isRight; });
  var minGap = 22;
  antiCollide(rightLabels, minGap, 14, H - 14);
  antiCollide(leftLabels, minGap, 14, H - 14);
  
  // X posizione testo: ben fuori dal donut (35px dal bordo arco esterno)
  var rightLabelX = cx + rOuter + 35;
  var leftLabelX = cx - rOuter - 35;
  
  // Disegna linee L-shape + testo
  var allLabels = rightLabels.concat(leftLabels);
  for (var i = 0; i < allLabels.length; i++) {
    var l = allLabels[i];
    var dirSign = l.isRight ? 1 : -1;
    var labelX = l.isRight ? rightLabelX : leftLabelX;
    var textAnchor = l.isRight ? 'start' : 'end';
    var textX = l.isRight ? labelX + 6 : labelX - 6;
    
    // L-shape: anchor → punto orizzontale corto → punto verticale → punto testo
    // p1: ancora (sull'arco)
    // p2: 10px in orizzontale verso il lato (anchorX + 10*dirSign, anchorY)
    // p3: stessa X di p2, ma Y = labelY (segmento verticale)
    // p4: labelX, labelY (segmento orizzontale corto fino al pallino)
    var p1x = l.anchorX, p1y = l.anchorY;
    var p2x = l.anchorX + dirSign * 8;
    var p2y = l.anchorY;
    var p3x = labelX - dirSign * 6;
    var p3y = l.labelY;
    var p4x = labelX;
    var p4y = l.labelY;
    
    svg += '<polyline points="' + p1x + ',' + p1y + ' ' + p2x + ',' + p2y + ' ' + p3x + ',' + p3y + ' ' + p4x + ',' + p4y + '" ';
    svg += 'fill="none" stroke="' + l.color + '" stroke-width="1.2" opacity="0.75"/>';
    // Pallino all'estremità della linea (inizio testo)
    svg += '<circle cx="' + p4x + '" cy="' + p4y + '" r="2.2" fill="' + l.color + '"/>';
    // Testo nome
    svg += '<text x="' + textX + '" y="' + (l.labelY - 1) + '" ';
    svg += 'text-anchor="' + textAnchor + '" font-size="10" font-weight="600" font-family="Arial, sans-serif" fill="#333">';
    svg += escapeHTML(l.name);
    svg += '</text>';
    // Testo percentuale (sotto, più piccolo, colorato come la fetta)
    svg += '<text x="' + textX + '" y="' + (l.labelY + 10) + '" ';
    svg += 'text-anchor="' + textAnchor + '" font-size="9" font-weight="700" font-family="Arial, sans-serif" fill="' + l.color + '">';
    svg += l.pct.toFixed(1).replace('.', ',') + '%';
    svg += '</text>';
  }
  
  // Totale al centro del donut
  svg += '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" font-size="9" fill="#7a6b6c" font-weight="600" font-family="Arial, sans-serif" letter-spacing="1">BOTTIGLIE ' + r.anno + '</text>';
  svg += '<text x="' + cx + '" y="' + (cy + 12) + '" text-anchor="middle" font-size="18" fill="#722F37" font-weight="700" font-family="Arial, sans-serif">' + NUM(totalForDonut) + '</text>';
  
  svg += '</svg>';
  
  var html = '<div class="donut-wrap">';
  html += '<div class="donut-center">' + svg + '</div>';
  
  // Legenda tabellare a destra del donut
  html += '<div class="donut-legend">';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    html += '<div class="legend-row">';
    html += '<div class="legend-color" style="background:' + it.color + '"></div>';
    html += '<div><div class="legend-name">' + escapeHTML(it.name) + '</div>';
    html += '<div style="font-size:10px;color:var(--muted);margin-top:2px">' + EUR(it.fatt26) + '</div></div>';
    html += '<div class="legend-val">' + NUM(it.btlEq26) + ' bt<br><span style="font-size:10px;color:var(--muted);font-weight:400">vs ' + NUM(it.btlEq25) + ' nel ' + r.annoP + '</span></div>';
    html += '<div class="legend-pct">' + it.pctTot.toFixed(1).replace('.', ',') + '%<br><span class="' + (it.dRef>=0?'text-green':'text-red') + '" style="font-size:10px">' + PCTsign(it.dRef) + '</span></div>';
    html += '</div>';
  }
  html += '</div>';
  html += '</div>';
  
  return html;
}

// Sezione "Vendite per formato": 4 KPI card + matrice referenza × formato
function buildFormatiSection(r) {
  var fmt26 = r.fmt26, fmt25 = r.fmt25;
  
  // Calcolo totale bottiglie equivalenti per percentuali
  var totBtlEq26 = 0, totBtl26 = 0, totFatt26 = 0;
  for (var i = 0; i < FORMATI_NAMES.length; i++) {
    totBtlEq26 += fmt26.totali[FORMATI_NAMES[i]].btlEq;
    totBtl26 += fmt26.totali[FORMATI_NAMES[i]].btl;
    totFatt26 += fmt26.totali[FORMATI_NAMES[i]].fatt;
  }
  
  // Colori per i 4 formati (uniformi e riconoscibili)
  var COLORI_FORMATO = {
    '0,375L': '#B47AAE',
    '0,75L': '#722F37',
    'Magnum (1,5L)': '#C9A84C',
    'Jeroboam (3L)': '#4A6FA5',
    'Altro formato': '#7a6b6c'
  };
  
  // ============ PARTE A: 4 KPI CARD ============
  var html = '<div class="fmt-cards-row">';
  
  // Solo formati con vendite
  for (var i = 0; i < FORMATI_NAMES.length; i++) {
    var name = FORMATI_NAMES[i];
    var d26 = fmt26.totali[name];
    var d25 = fmt25.totali[name];
    if (d26.btl === 0 && d25.btl === 0) continue;
    
    var pctTot = totBtlEq26 > 0 ? (d26.btlEq / totBtlEq26) * 100 : 0;
    var dVar = d25.btlEq > 0 ? ((d26.btlEq - d25.btlEq) / d25.btlEq) * 100 : (d26.btlEq > 0 ? 100 : 0);
    var dVarColor = dVar >= 0 ? 'text-green' : 'text-red';
    var color = COLORI_FORMATO[name] || '#7a6b6c';
    
    html += '<div class="fmt-card" style="border-left-color:' + color + '">';
    html += '<div class="fmt-card-label">' + escapeHTML(name) + '</div>';
    html += '<div class="fmt-card-main">' + NUM(d26.btl) + '</div>';
    html += '<div class="fmt-card-sub">bottiglie effettive</div>';
    if (d26.btl !== d26.btlEq) {
      html += '<div class="fmt-card-eq">= ' + NUM(d26.btlEq) + ' eq. 0,75L</div>';
    }
    html += '<div class="fmt-card-bottom">';
    html += '<div class="fmt-card-pct">' + pctTot.toFixed(1).replace('.', ',') + '% del totale</div>';
    html += '<div class="fmt-card-var ' + dVarColor + '">' + PCTsign(dVar) + ' vs ' + r.annoP + '</div>';
    html += '</div>';
    html += '<div class="fmt-card-fatt">' + EUR(d26.fatt) + '</div>';
    html += '</div>';
  }
  html += '</div>';
  
  // ============ PARTE B: MATRICE REFERENZA × FORMATO ============
  html += '<div class="fmt-matrix-wrap">';
  html += '<div class="fmt-matrix-title">Suddivisione formati per referenza (bottiglie effettive)</div>';
  html += '<div class="table-wrap"><div class="table-scroll"><table class="fmt-matrix">';
  html += '<thead><tr>';
  html += '<th class="text-left">Referenza</th>';
  // Solo formati con almeno 1 bottiglia totale
  var formatiAttivi = [];
  for (var i = 0; i < FORMATI_NAMES.length; i++) {
    var name = FORMATI_NAMES[i];
    if (fmt26.totali[name].btl > 0 || fmt25.totali[name].btl > 0) {
      formatiAttivi.push(name);
    }
  }
  for (var i = 0; i < formatiAttivi.length; i++) {
    var color = COLORI_FORMATO[formatiAttivi[i]] || '#7a6b6c';
    html += '<th class="text-right" style="border-bottom:2px solid ' + color + '">' + escapeHTML(formatiAttivi[i]) + '</th>';
  }
  html += '<th class="text-right">Totale eq.</th>';
  html += '<th class="text-right">Fatturato</th>';
  html += '</tr></thead><tbody>';
  
  // Righe: una per referenza con vendite
  var refsArr = REFERENZE_NAMES.slice();
  refsArr.push('Altro');
  for (var j = 0; j < refsArr.length; j++) {
    var ref = refsArr[j];
    var rData = fmt26.matrix[ref] || {};
    var totRefEq = 0, totRefFatt = 0;
    var hasData = false;
    for (var i = 0; i < formatiAttivi.length; i++) {
      var d = rData[formatiAttivi[i]] || { btl: 0, btlEq: 0, fatt: 0 };
      if (d.btl > 0) hasData = true;
      totRefEq += d.btlEq;
      totRefFatt += d.fatt;
    }
    if (!hasData) continue;
    
    html += '<tr>';
    html += '<td><strong>' + escapeHTML(ref) + '</strong></td>';
    for (var i = 0; i < formatiAttivi.length; i++) {
      var d = rData[formatiAttivi[i]] || { btl: 0, btlEq: 0, fatt: 0 };
      if (d.btl === 0) {
        html += '<td class="text-right text-muted">—</td>';
      } else {
        html += '<td class="text-right">' + NUM(d.btl) + '</td>';
      }
    }
    html += '<td class="text-right"><strong>' + NUM(totRefEq) + '</strong></td>';
    html += '<td class="text-right">' + EUR(totRefFatt) + '</td>';
    html += '</tr>';
  }
  
  // Riga totale
  html += '<tr class="tot-row">';
  html += '<td>TOTALE</td>';
  for (var i = 0; i < formatiAttivi.length; i++) {
    var d = fmt26.totali[formatiAttivi[i]];
    html += '<td class="text-right">' + NUM(d.btl) + '</td>';
  }
  html += '<td class="text-right">' + NUM(totBtlEq26) + '</td>';
  html += '<td class="text-right">' + EUR(totFatt26) + '</td>';
  html += '</tr>';
  
  html += '</tbody></table></div></div>';
  html += '</div>';
  
  return html;
}

function buildSummBlock(color, label, count, delta, type, enabled) {
  var html = '<div class="summ-block ' + color + (enabled?'':' disabled') + '"' + (enabled?' onclick="openFV(\'' + type + '\')"':'') + '>';
  html += '<div class="summ-top"><h4>' + label + '</h4>';
  html += enabled ? '<span class="summ-arrow">›</span>' : '';
  html += '</div>';
  html += '<div class="summ-num">' + count + '</div>';
  if (count > 0) {
    var deltaClass = delta >= 0 ? 'text-green' : 'text-red';
    html += '<div class="summ-delta">Var €: <span class="delta-val ' + deltaClass + '">' + EURsign(delta) + '</span></div>';
  }
  html += '</div>';
  return html;
}

function buildChart(t26, t25, anno, annoP, periodo) {
  var mesiDa = periodo ? periodo.da : 1;
  var mesiA = periodo ? periodo.a : 12;
  var nMesi = mesiA - mesiDa + 1;
  
  var maxV = 0;
  for (var m = mesiDa; m <= mesiA; m++) {
    if (t26[m] > maxV) maxV = t26[m];
    if (t25[m] > maxV) maxV = t25[m];
  }
  if (maxV === 0) return '<p style="color:var(--muted);font-size:12px;padding:20px;text-align:center">Nessun dato nel periodo selezionato</p>';
  
  // Formato compatto per valori nelle righe sotto il grafico
  function fmtV(v) {
    if (!v || v === 0) return '—';
    if (v >= 1000000) return (v/1000000).toFixed(1).replace('.', ',') + 'M';
    if (v >= 1000) return (v/1000).toFixed(1).replace('.', ',') + 'k';
    return Math.round(v).toString();
  }
  
  // Grafico SVG (solo le linee, senza etichette valore)
  var w = 760, h = 210, padL = 60, padR = 20, padT = 22, padB = 36;
  var cw = w - padL - padR;
  var ch = h - padT - padB;
  var step = nMesi > 1 ? cw / (nMesi - 1) : cw / 2;
  
  var svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block" font-family="Arial, sans-serif">';
  
  // Gridlines orizzontali
  for (var i = 0; i <= 4; i++) {
    var gy = padT + (ch * i / 4);
    var val = maxV * (4 - i) / 4;
    svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w-padR) + '" y2="' + gy + '" stroke="#e8dede" stroke-width="1"/>';
    var lbl = val >= 1000000 ? (val/1000000).toFixed(1)+'M' : (val >= 1000 ? Math.round(val/1000)+'k' : Math.round(val));
    svg += '<text x="' + (padL-8) + '" y="' + (gy+3) + '" text-anchor="end" font-size="10" fill="#7a6b6c">' + lbl + '</text>';
  }
  
  function xc(m) {
    return nMesi === 1 ? padL + cw / 2 : padL + (m - mesiDa) * step;
  }
  
  // Asse X — solo mese abbreviato
  for (var m = mesiDa; m <= mesiA; m++) {
    svg += '<text x="' + xc(m) + '" y="' + (h-12) + '" text-anchor="middle" font-size="10" fill="#7a6b6c" font-weight="600">' + meseAbbr(m) + '</text>';
  }
  
  // Indicatore "aggiornato al" per YTD
  if (periodo && periodo.mode === 'YTD' && periodo.giornoMax > 0 && periodo.giornoMax < 28) {
    svg += '<text x="' + (w-padR) + '" y="14" text-anchor="end" font-size="9" fill="#7a6b6c" font-style="italic">aggiornato al ' + periodo.giornoMax + ' ' + meseAbbr(periodo.a).toLowerCase() + '</text>';
  }
  
  // Linea 2025 (oro tratteggiata)
  if (nMesi > 1) {
    var pts25 = [];
    for (var m = mesiDa; m <= mesiA; m++) pts25.push(xc(m) + ',' + (padT + ch - ((t25[m]/maxV)*ch)));
    svg += '<polyline points="' + pts25.join(' ') + '" fill="none" stroke="#C9A84C" stroke-width="2.5" stroke-dasharray="6,4"/>';
  }
  // Punti 2025
  for (var m = mesiDa; m <= mesiA; m++) {
    if (!t25[m]) continue;
    var y25 = padT + ch - ((t25[m]/maxV)*ch);
    svg += '<circle cx="' + xc(m) + '" cy="' + y25 + '" r="3.5" fill="#C9A84C" stroke="white" stroke-width="1.5"/>';
  }
  
  // Linea 2026 (bordeaux piena)
  if (nMesi > 1) {
    var pts26 = [];
    for (var m = mesiDa; m <= mesiA; m++) {
      if (t26[m] > 0 || pts26.length > 0) pts26.push(xc(m) + ',' + (padT + ch - ((t26[m]/maxV)*ch)));
    }
    if (pts26.length > 1) svg += '<polyline points="' + pts26.join(' ') + '" fill="none" stroke="#722F37" stroke-width="3"/>';
  }
  // Punti 2026
  for (var m = mesiDa; m <= mesiA; m++) {
    if (!t26[m]) continue;
    var y26 = padT + ch - ((t26[m]/maxV)*ch);
    svg += '<circle cx="' + xc(m) + '" cy="' + y26 + '" r="4" fill="#722F37" stroke="white" stroke-width="2"/>';
  }
  
  svg += '</svg>';
  
  // Tabella valori sotto il grafico: riga 2026 + riga 2025
  // Usa una grid CSS per allineare perfettamente con i mesi del grafico SVG
  // padL/w in percentuale: padL=60/760, padR=20/760
  var pctL = (60/760*100).toFixed(2) + '%';
  var pctR = (20/760*100).toFixed(2) + '%';
  
  var tbl = '<div style="display:flex;padding-left:' + pctL + ';padding-right:' + pctR + ';gap:0;border-top:1px solid #e8dede;margin-top:0">';
  for (var m = mesiDa; m <= mesiA; m++) {
    var isLast = (m === mesiA);
    tbl += '<div style="flex:1;text-align:center;padding:4px 2px 2px 2px' + (isLast ? '' : ';border-right:1px solid #f0e8e8') + '">';
    tbl += '<div style="font-size:10px;font-weight:700;color:#722F37;line-height:1.4">' + fmtV(t26[m]) + '</div>';
    tbl += '<div style="font-size:10px;font-weight:500;color:#b8922c;line-height:1.4">' + fmtV(t25[m]) + '</div>';
    tbl += '</div>';
  }
  tbl += '</div>';
  
  // Legenda miniatura fianco ai valori
  var legend = '<div style="display:flex;gap:16px;padding:2px ' + pctR + ' 4px ' + pctL + ';font-size:10px">';
  legend += '<span style="color:#722F37;font-weight:700">● ' + anno + '</span>';
  legend += '<span style="color:#b8922c;font-weight:600">● ' + annoP + '</span>';
  legend += '</div>';
  
  return '<div style="position:relative">' + svg + tbl + legend + '</div>';
}

function openFV(tipo) {
  var data, title;
  var entity = lastReport.isItalia ? 'agenti' : 'clienti';
  var entityCap = lastReport.isItalia ? 'Agenti' : 'Clienti';
  if (tipo === 'tutti')         { data = lastReport.tutti;       title = 'Universo ' + entity + ' (attivi + persi)'; }
  else if (tipo === 'portafoglio') { data = lastReport.portafoglio; title = 'Portafoglio ' + lastReport.anno + ' — ' + entityCap + ' attivi'; }
  else if (tipo === 'attivi')   { data = lastReport.attivi;      title = entityCap + ' attivi'; }
  else if (tipo === 'crescita') { data = lastReport.crescita;    title = entityCap + ' in crescita'; }
  else if (tipo === 'calo')     { data = lastReport.calo;        title = entityCap + ' in calo'; }
  else if (tipo === 'nuovi')    { data = lastReport.nuovi;       title = entityCap + ' nuovi ' + lastReport.anno; }
  else if (tipo === 'persi')    { data = lastReport.persi;       title = entityCap + ' persi (non attivi ' + lastReport.anno + ')'; }
  else if (tipo === 'assenti')  { data = lastReport.assenti;     title = 'Non ancora attivi'; }
  
  // Salva snapshot della vista corrente prima di aprire FV
  window._mainSnapshot = {
    vista: lastReport.vista,
    anno: lastReport.anno,
    periodoMode: document.getElementById('periodo').value,
    meseDa: document.getElementById('mese-da').value,
    meseA: document.getElementById('mese-a').value,
    domOrder: readTableOrder('main-tbl', lastReport.tutti),
    sortStates: JSON.parse(JSON.stringify(sortStates)),
    scrollY: document.querySelector('.content').scrollTop || 0
  };
  
  fvStack = [];
  showFV({ type: 'lista', data: data, title: title, isItalia: lastReport.isItalia });
}

function showFV(state) {
  fvStack.push(state);
  renderFV();
}

function renderFV() {
  var state = fvStack[fvStack.length - 1];
  
  if (state.type === 'lista') {
    renderFVLista(state);
  } else if (state.type === 'cliente') {
    renderFVCliente(state);
  }
  
  document.getElementById('fv').classList.add('open');
}

function renderFVLista(state) {
  var data = state.data;
  var title = state.title;
  var isItalia = state.isItalia;
  window._fvData = data;
  window._fvTitle = title;
  window._fvType = 'lista';
  window._fvIsItalia = isItalia;
  
  var entity = isItalia ? 'agenti' : 'clienti';
  
  document.getElementById('fv-bc').textContent = title + ' · ' + lastReport.vista;
  
  var f26 = 0, f25 = 0, b26 = 0, b25 = 0, b26Eq = 0, b25Eq = 0;
  for (var i = 0; i < data.length; i++) {
    f26 += data[i].f26; f25 += data[i].f25;
    b26 += data[i].b26 || 0; b25 += data[i].b25 || 0;
    b26Eq += data[i].b26Eq || 0; b25Eq += data[i].b25Eq || 0;
  }
  var pm26 = PM(f26, b26Eq), pm25 = PM(f25, b25Eq);
  var dF = f25 > 0 ? ((f26 - f25) / f25) * 100 : 0;
  var dB = b25Eq > 0 ? ((b26Eq - b25Eq) / b25Eq) * 100 : 0;
  var dPM = pm25 > 0 ? ((pm26 - pm25) / pm25) * 100 : 0;
  
  var html = '<div class="fv-title">' + escapeHTML(title) + '</div><div class="fv-sub">' + escapeHTML(lastReport.vista) + ' · ' + escapeHTML(lastReport.periodo.label) + ' · ' + data.length + ' ' + entity + '</div>';
  
  html += '<div class="kpi-row">';
  html += '<div class="kpi-card"><div class="kpi-label">Fatturato 2026</div><div class="kpi-value">' + EUR(f26) + '</div><div class="kpi-sub">vs ' + EUR(f25) + '</div><div class="kpi-sub"><span class="' + (f26-f25>=0?'text-green':'text-red') + '" style="font-weight:700">' + EURsign(f26-f25) + '</span> <span class="badge ' + (dF>=0?'badge-up':'badge-down') + '">' + PCTsign(dF) + '</span></div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Bottiglie 2026</div><div class="kpi-value">' + NUM(b26Eq) + '</div><div class="kpi-sub">vs ' + NUM(b25Eq) + '</div><div class="kpi-sub"><span class="' + (b26Eq-b25Eq>=0?'text-green':'text-red') + '" style="font-weight:700">' + NUMsign(b26Eq-b25Eq) + '</span> <span class="badge ' + (dB>=0?'badge-up':'badge-down') + '">' + PCTsign(dB) + '</span></div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Prezzo Medio</div><div class="kpi-value">' + EUR(pm26) + '</div><div class="kpi-sub">vs ' + EUR(pm25) + '</div><div class="kpi-sub"><span class="' + (pm26-pm25>=0?'text-green':'text-red') + '" style="font-weight:700">' + EURsign(pm26-pm25) + '</span> <span class="badge ' + (dPM>=0?'badge-up':'badge-down') + '">' + PCTsign(dPM) + '</span></div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">' + (isItalia ? 'Agenti' : 'Clienti') + '</div><div class="kpi-value">' + data.length + '</div><div class="kpi-sub">in questa lista</div></div>';
  html += '</div>';
  
  html += buildFVTable(data, 'fv-tbl', f26, f25, b26Eq, b25Eq, isItalia);
  
  document.getElementById('fv-body').innerHTML = html;
  
  setTimeout(function() {
    initSort('fv-tbl');
    initResize('fv-tbl');
    bindFVRowClicks('fv-tbl', data, isItalia);
  }, 50);
}

function bindFVRowClicks(tblId, data, isItalia) {
  var rows = document.querySelectorAll('#' + tblId + ' tbody tr:not(.tot-row)');
  for (var i = 0; i < rows.length; i++) {
    (function(row) {
      row.classList.add('clik');
      row.addEventListener('click', function() {
        var name = row.cells[0].textContent.trim();
        if (isItalia) {
          // Click su un agente → cambia vista
          document.getElementById('vista').value = name;
          closeFV();
          fvStack = [];
          generaReport();
          window.scrollTo(0, 0);
        } else {
          openClienteFV(name);
        }
      });
    })(rows[i]);
  }
}

    html += '<th data-col="9" data-type="num" class="text-right">PM 2026 <span class="sort-arrow">▼</span></th>';
  }
  html += '</tr></thead><tbody>';
  
  for (var i = 0; i < data.length; i++) {
    var c = data[i];
    var varV = c.f26 - c.f25;
    var varP = c.f25 > 0 ? ((c.f26 - c.f25) / c.f25) * 100 : (c.f26 > 0 ? 100 : -100);
    var varColor = varV >= 0 ? 'text-green' : 'text-red';
    
    html += '<tr>';
    html += '<td>' + escapeHTML(c.nome) + '</td>';
    if (isItalia) {
      html += '<td class="text-right">' + (c.nClienti26 || 0) + '</td>';
    } else {
      html += '<td class="text-muted">' + escapeHTML(c.citta || '') + '</td>';
      html += '<td class="text-muted">' + escapeHTML(c.agente || '') + '</td>';
    }
    html += '<td class="text-right">' + EUR(c.f26) + '</td>';
    html += '<td class="text-right">' + EUR(c.f25) + '</td>';
    html += '<td class="text-right ' + varColor + '">' + EURsign(varV) + '</td>';
    html += '<td class="text-right ' + varColor + '">' + PCTsign(varP) + '</td>';
    html += '<td class="text-right">' + NUM(c.b26Eq || 0) + '</td>';
    html += '<td class="text-right">' + NUM(c.b25Eq || 0) + '</td>';
    html += '<td class="text-right">' + EUR(c.pm26) + '</td>';
    html += '</tr>';
  }
  
  var totVarV = totF26 - totF25;
  var totVarP = totF25 > 0 ? ((totF26-totF25)/totF25)*100 : 0;
  var totPM26 = PM(totF26, totB26Eq);
  var totColor = totVarV >= 0 ? 'text-green' : 'text-red';
  
  html += '<tr class="tot-row">';
  html += '<td>TOTALE</td>';
  html += '<td></td>';
  if (!isItalia) html += '<td></td>';
  html += '<td class="text-right">' + EUR(totF26) + '</td>';
  html += '<td class="text-right">' + EUR(totF25) + '</td>';
  html += '<td class="text-right ' + totColor + '">' + EURsign(totVarV) + '</td>';
  html += '<td class="text-right ' + totColor + '">' + PCTsign(totVarP) + '</td>';
  html += '<td class="text-right">' + NUM(totB26Eq) + '</td>';
  html += '<td class="text-right">' + NUM(totB25Eq) + '</td>';
  html += '<td class="text-right">' + EUR(totPM26) + '</td>';
  html += '</tr>';
  
  html += '</tbody></table></div></div>';
  return html;
}

function openClienteFV(nome) {

}

function renderFVCliente(state) {
  var nome = state.nome;
  var anno = lastReport.anno;
  var annoP = lastReport.annoP;
  var periodo = lastReport.periodo;
  
  // Calcola dati cliente con filtro giorno-preciso
  var v26 = [], v25 = [];
  for (var i = 0; i < D.length; i++) {
    if (D[i].cliente !== nome) continue;
    if (D[i].tipoRiga !== 'Vendita') continue;
    if (!inPeriodo(D[i], periodo)) continue;
    if (D[i].anno === anno) v26.push(D[i]);
    if (D[i].anno === annoP) v25.push(D[i]);
  }
  
  var f26 = 0, b26 = 0, b26Eq = 0, f25 = 0, b25 = 0, b25Eq = 0;
  for (var i = 0; i < v26.length; i++) {
    if (!isRigaFatturato(v26[i])) continue;
    f26 += v26[i].importo;
    if (isRigaBottiglia(v26[i])) { b26 += v26[i].pezzi; b26Eq += v26[i].pezziEq; }
  }
  for (var i = 0; i < v25.length; i++) {
    if (!isRigaFatturato(v25[i])) continue;
    f25 += v25[i].importo;
    if (isRigaBottiglia(v25[i])) { b25 += v25[i].pezzi; b25Eq += v25[i].pezziEq; }
  }
  var pm26 = PM(f26, b26Eq), pm25 = PM(f25, b25Eq);
  var dF = f25 > 0 ? ((f26 - f25) / f25) * 100 : 0;
  var dB = b25Eq > 0 ? ((b26Eq - b25Eq) / b25Eq) * 100 : 0;
  var dPM = pm25 > 0 ? ((pm26 - pm25) / pm25) * 100 : 0;
  
  // Agente, città, provincia
  var agente = '', citta = '', prov = '';
  for (var i = 0; i < v26.length; i++) {
    if (v26[i].agente) { agente = v26[i].agente; citta = v26[i].citta; prov = v26[i].prov; break; }
  }
  if (!agente) for (var i = 0; i < v25.length; i++) {
    if (v25[i].agente) { agente = v25[i].agente; citta = v25[i].citta; prov = v25[i].prov; break; }
  }
  
  // Referenze
  var refs26 = calcolaReferenze(v26);
  var refs25 = calcolaReferenze(v25);
  
  // Fatture (raggruppate per num_doc + data)
  var fatture = {};
  for (var i = 0; i < v26.length; i++) {
    var key = v26[i].numDoc + '|' + v26[i].dataStr;
    if (!fatture[key]) fatture[key] = { numDoc: v26[i].numDoc, data: v26[i].dataStr, dataISO: v26[i].dataISO, importo: 0, pezzi: 0, pezziEq: 0 };
    fatture[key].importo += v26[i].importo;
    fatture[key].pezzi += v26[i].pezzi;
    fatture[key].pezziEq += v26[i].pezziEq;
  }
  var fattureArr = Object.values(fatture).sort(function(a, b) { return (a.dataISO < b.dataISO) ? 1 : -1; });
  
  document.getElementById('fv-bc').textContent = 'Cliente: ' + nome + (agente ? ' · ' + agente : '');
  window._fvData = null;
  window._fvType = 'cliente';
  window._fvCliente = nome;
  
  var subtitleParts = [];
  if (agente) subtitleParts.push(escapeHTML(agente));
  if (citta) subtitleParts.push(escapeHTML(citta) + (prov ? ' (' + escapeHTML(prov) + ')' : ''));
  subtitleParts.push(escapeHTML(lastReport.periodo.label));
  
  var html = '<div class="fv-title">' + escapeHTML(nome) + '</div>';
  html += '<div class="fv-sub">' + subtitleParts.join(' · ') + '</div>';
  
  html += '<div class="kpi-row">';
  html += '<div class="kpi-card"><div class="kpi-label">Fatturato ' + anno + '</div><div class="kpi-value">' + EUR(f26) + '</div><div class="kpi-sub">vs ' + EUR(f25) + '</div><div class="kpi-sub"><span class="' + (f26-f25>=0?'text-green':'text-red') + '" style="font-weight:700">' + EURsign(f26-f25) + '</span> <span class="badge ' + (dF>=0?'badge-up':'badge-down') + '">' + PCTsign(dF) + '</span></div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Bottiglie ' + anno + '</div><div class="kpi-value">' + NUM(b26Eq) + '</div><div class="kpi-sub">vs ' + NUM(b25Eq) + '</div><div class="kpi-sub"><span class="' + (b26Eq-b25Eq>=0?'text-green':'text-red') + '" style="font-weight:700">' + NUMsign(b26Eq-b25Eq) + '</span> <span class="badge ' + (dB>=0?'badge-up':'badge-down') + '">' + PCTsign(dB) + '</span></div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Prezzo Medio</div><div class="kpi-value">' + EUR(pm26) + '</div><div class="kpi-sub">vs ' + EUR(pm25) + '</div><div class="kpi-sub"><span class="' + (pm26-pm25>=0?'text-green':'text-red') + '" style="font-weight:700">' + EURsign(pm26-pm25) + '</span> <span class="badge ' + (dPM>=0?'badge-up':'badge-down') + '">' + PCTsign(dPM) + '</span></div></div>';
  html += '<div class="kpi-card"><div class="kpi-label">Fatture ' + anno + '</div><div class="kpi-value">' + fattureArr.length + '</div><div class="kpi-sub">documenti emessi</div></div>';
  html += '</div>';
  
  // Referenze cliente — DONUT
  html += '<div class="section"><div class="section-title">Rotazione referenze ' + anno + '</div>';
  html += buildDonutReferenzeCliente(refs26, refs25, b26Eq, anno, annoP);
  html += '</div>';
  
  // Elenco fatture
  html += '<div class="section"><div class="section-title">Fatture ' + anno + ' (' + fattureArr.length + ')</div>';
  html += '<div class="table-wrap"><div class="table-scroll"><table id="fv-fat-tbl">';
  html += '<thead><tr>';
  html += '<th data-col="0" data-type="str">Data <span class="sort-arrow">▼</span><span class="col-resize"></span></th>';
  html += '<th data-col="1" data-type="str">N. Doc <span class="sort-arrow">▼</span><span class="col-resize"></span></th>';
  html += '<th data-col="2" data-type="num" class="text-right">Bottiglie <span class="sort-arrow">▼</span><span class="col-resize"></span></th>';
  html += '<th data-col="3" data-type="num" class="text-right">Bott. <span class="sort-arrow">▼</span><span class="col-resize"></span></th>';
  html += '<th data-col="4" data-type="num" class="text-right">Importo <span class="sort-arrow">▼</span></th>';
  html += '</tr></thead><tbody>';
  for (var i = 0; i < fattureArr.length; i++) {
    var f = fattureArr[i];
    html += '<tr><td>' + escapeHTML(f.data) + '</td><td>' + escapeHTML(f.numDoc) + '</td><td class="text-right">' + NUM(f.pezzi) + '</td><td class="text-right">' + NUM(f.pezziEq) + '</td><td class="text-right">' + EUR(f.importo) + '</td></tr>';
  }
  html += '<tr class="tot-row"><td>TOTALE</td><td></td><td class="text-right">' + NUM(b26) + '</td><td class="text-right">' + NUM(b26Eq) + '</td><td class="text-right">' + EUR(f26) + '</td></tr>';
  html += '</tbody></table></div></div></div>';
  
  document.getElementById('fv-body').innerHTML = html;
  
  setTimeout(function() {
    initSort('fv-fat-tbl');
    initResize('fv-fat-tbl');
  }, 50);
}

function buildDonutReferenzeCliente(refs26, refs25, totalBtl, anno, annoP) {
  var refNames = REFERENZE.map(function(x) { return x.name; });
  refNames.push('Altro');
  var COLORS = ['#722F37', '#C9A84C', '#8B5A3C', '#4A6FA5', '#7E9F3A', '#B47AAE', '#D88B4C', '#5C8A8A', '#A03333', '#6B4E71'];
  
  var items = [];
  for (var i = 0; i < refNames.length; i++) {
    var name = refNames[i];
    var r26 = refs26[name] || { fatt: 0, btl: 0, btlEq: 0 };
    var r25 = refs25[name] || { fatt: 0, btl: 0, btlEq: 0 };
    if (r26.btlEq === 0 && r25.btlEq === 0) continue;
    items.push({
      name: name,
      btlEq26: r26.btlEq, btlEq25: r25.btlEq,
      fatt26: r26.fatt, fatt25: r25.fatt,
      pctTot: totalBtl > 0 ? (r26.btlEq / totalBtl) * 100 : 0,
      dRef: r25.btlEq > 0 ? ((r26.btlEq - r25.btlEq) / r25.btlEq) * 100 : (r26.btlEq > 0 ? 100 : 0),
      color: COLORS[i % COLORS.length]
    });
  }
  items.sort(function(a, b) { return b.btlEq26 - a.btlEq26; });
  if (items.length === 0) return '<p style="color:var(--muted);font-size:12px">Nessun dato</p>';
  
  // Donut con callout labels esterne L-shape (stesso stile del report)
  var W = 460, H = 360;
  var cx = W / 2, cy = H / 2;
  var rOuter = 95, rInner = 58;
  var rLabelStart = rOuter + 4;
  
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="donut-svg" preserveAspectRatio="xMidYMid meet">';
  var startAngle = -90;
  var totalForDonut = 0;
  for (var i = 0; i < items.length; i++) totalForDonut += items[i].btlEq26;
  
  var labelsToDraw = [];
  
  if (totalForDonut > 0) {
    for (var i = 0; i < items.length; i++) {
      var pct = items[i].btlEq26 / totalForDonut;
      var angle = pct * 360;
      var endAngle = startAngle + angle;
      var midAngle = startAngle + angle / 2;
      var startRad = (startAngle * Math.PI) / 180;
      var endRad = (endAngle * Math.PI) / 180;
      var midRad = (midAngle * Math.PI) / 180;
      var x1 = cx + rOuter * Math.cos(startRad), y1 = cy + rOuter * Math.sin(startRad);
      var x2 = cx + rOuter * Math.cos(endRad), y2 = cy + rOuter * Math.sin(endRad);
      var x3 = cx + rInner * Math.cos(endRad), y3 = cy + rInner * Math.sin(endRad);
      var x4 = cx + rInner * Math.cos(startRad), y4 = cy + rInner * Math.sin(startRad);
      var largeArc = angle > 180 ? 1 : 0;
      var path = 'M ' + x1 + ' ' + y1 +
                 ' A ' + rOuter + ' ' + rOuter + ' 0 ' + largeArc + ' 1 ' + x2 + ' ' + y2 +
                 ' L ' + x3 + ' ' + y3 +
                 ' A ' + rInner + ' ' + rInner + ' 0 ' + largeArc + ' 0 ' + x4 + ' ' + y4 + ' Z';
      svg += '<path d="' + path + '" fill="' + items[i].color + '" stroke="white" stroke-width="1.5"/>';
      
      var pctValue = pct * 100;
      if (pctValue >= 0.5) {
        var anchorX = cx + rLabelStart * Math.cos(midRad);
        var anchorY = cy + rLabelStart * Math.sin(midRad);
        var isRightSide = Math.cos(midRad) >= 0;
        labelsToDraw.push({
          anchorX: anchorX, anchorY: anchorY,
          labelY: anchorY,
          isRight: isRightSide,
          color: items[i].color,
          name: items[i].name,
          pct: pctValue
        });
      }
      startAngle = endAngle;
    }
  }
  
  // Anti-collision bidirezionale
  function antiCollide(labels, minGap, topY, bottomY) {
    if (labels.length === 0) return;
    labels.sort(function(a, b) { return a.anchorY - b.anchorY; });
    for (var i = 0; i < labels.length; i++) labels[i].labelY = labels[i].anchorY;
    for (var i = 1; i < labels.length; i++) {
      if (labels[i].labelY < labels[i-1].labelY + minGap) {
        labels[i].labelY = labels[i-1].labelY + minGap;
      }
    }
    if (labels[labels.length-1].labelY > bottomY) {
      labels[labels.length-1].labelY = bottomY;
      for (var i = labels.length - 2; i >= 0; i--) {
        if (labels[i].labelY > labels[i+1].labelY - minGap) {
          labels[i].labelY = labels[i+1].labelY - minGap;
        }
      }
    }
    if (labels[0].labelY < topY) {
      labels[0].labelY = topY;
      for (var i = 1; i < labels.length; i++) {
        if (labels[i].labelY < labels[i-1].labelY + minGap) {
          labels[i].labelY = labels[i-1].labelY + minGap;
        }
      }
    }
  }
  
  var rightLabels = labelsToDraw.filter(function(l) { return l.isRight; });
  var leftLabels = labelsToDraw.filter(function(l) { return !l.isRight; });
  var minGap = 22;
  antiCollide(rightLabels, minGap, 14, H - 14);
  antiCollide(leftLabels, minGap, 14, H - 14);
  
  var rightLabelX = cx + rOuter + 35;
  var leftLabelX = cx - rOuter - 35;
  
  var allLabels = rightLabels.concat(leftLabels);
  for (var i = 0; i < allLabels.length; i++) {
    var l = allLabels[i];
    var dirSign = l.isRight ? 1 : -1;
    var labelX = l.isRight ? rightLabelX : leftLabelX;
    var textAnchor = l.isRight ? 'start' : 'end';
    var textX = l.isRight ? labelX + 6 : labelX - 6;
    
    var p1x = l.anchorX, p1y = l.anchorY;
    var p2x = l.anchorX + dirSign * 8;
    var p2y = l.anchorY;
    var p3x = labelX - dirSign * 6;
    var p3y = l.labelY;
    var p4x = labelX;
    var p4y = l.labelY;
    
    svg += '<polyline points="' + p1x + ',' + p1y + ' ' + p2x + ',' + p2y + ' ' + p3x + ',' + p3y + ' ' + p4x + ',' + p4y + '" ';
    svg += 'fill="none" stroke="' + l.color + '" stroke-width="1.2" opacity="0.75"/>';
    svg += '<circle cx="' + p4x + '" cy="' + p4y + '" r="2.2" fill="' + l.color + '"/>';
    svg += '<text x="' + textX + '" y="' + (l.labelY - 1) + '" ';
    svg += 'text-anchor="' + textAnchor + '" font-size="10" font-weight="600" font-family="Arial, sans-serif" fill="#333">';
    svg += escapeHTML(l.name);
    svg += '</text>';
    svg += '<text x="' + textX + '" y="' + (l.labelY + 10) + '" ';
    svg += 'text-anchor="' + textAnchor + '" font-size="9" font-weight="700" font-family="Arial, sans-serif" fill="' + l.color + '">';
    svg += l.pct.toFixed(1).replace('.', ',') + '%';
    svg += '</text>';
  }
  
  // Totale al centro
  svg += '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" font-size="9" fill="#7a6b6c" font-weight="600" font-family="Arial, sans-serif" letter-spacing="1">BOTTIGLIE ' + anno + '</text>';
  svg += '<text x="' + cx + '" y="' + (cy + 12) + '" text-anchor="middle" font-size="18" fill="#722F37" font-weight="700" font-family="Arial, sans-serif">' + NUM(totalForDonut) + '</text>';
  
  svg += '</svg>';
  
  var html = '<div class="donut-wrap">';
  html += '<div class="donut-center">' + svg + '</div>';
  
  // Legenda tabellare a destra: nome | bott. | fatturato | % | var %
  html += '<div class="donut-legend">';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    html += '<div class="legend-row">';
    html += '<div class="legend-color" style="background:' + it.color + '"></div>';
    html += '<div><div class="legend-name">' + escapeHTML(it.name) + '</div>';
    html += '<div style="font-size:10px;color:var(--muted);margin-top:2px">' + EUR(it.fatt26) + '</div></div>';
    html += '<div class="legend-val">' + NUM(it.btlEq26) + ' bt<br><span style="font-size:10px;color:var(--muted);font-weight:400">vs ' + NUM(it.btlEq25) + ' nel ' + annoP + '</span></div>';
    html += '<div class="legend-pct">' + it.pctTot.toFixed(1).replace('.', ',') + '%<br><span class="' + (it.dRef>=0?'text-green':'text-red') + '" style="font-size:10px">' + PCTsign(it.dRef) + '</span></div>';
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

function initSort(tblId) {
  var ths = document.querySelectorAll('#' + tblId + ' thead th');
  for (var i = 0; i < ths.length; i++) {
    (function(th, idx) {
      th.addEventListener('click', function(e) {
        if (e.target.classList.contains('col-resize')) return;
        sortTable(tblId, idx, th.getAttribute('data-type'));
      });
    })(ths[i], i);
  }
}

function sortTable(tblId, colIdx, type) {
  var tbl = document.getElementById(tblId);
  var tbody = tbl.querySelector('tbody');
  var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr:not(.tot-row)'));
  var totRow = tbody.querySelector('tr.tot-row');
  
  var key = tblId + ':' + colIdx;
  sortStates[key] = sortStates[key] === 'asc' ? 'desc' : 'asc';
  var dir = sortStates[key];
  
  rows.sort(function(a, b) {
    var av = a.cells[colIdx].textContent.trim();
    var bv = b.cells[colIdx].textContent.trim();
    if (type === 'num') {
      var an = parseFloat(av.replace(/[^\d\-,.]/g, '').replace(/\./g, '').replace(',', '.')) || 0;
      var bn = parseFloat(bv.replace(/[^\d\-,.]/g, '').replace(/\./g, '').replace(',', '.')) || 0;
      return dir === 'asc' ? an - bn : bn - an;
    }
    return dir === 'asc' ? av.localeCompare(bv, 'it') : bv.localeCompare(av, 'it');
  });
  
  var ths = tbl.querySelectorAll('thead th');
  for (var i = 0; i < ths.length; i++) {
    ths[i].classList.remove('sort-asc', 'sort-desc');
    var arr = ths[i].querySelector('.sort-arrow');
    if (arr) arr.textContent = '▼';
  }
  ths[colIdx].classList.add(dir === 'asc' ? 'sort-asc' : 'sort-desc');
  var arr = ths[colIdx].querySelector('.sort-arrow');
  if (arr) arr.textContent = dir === 'asc' ? '▲' : '▼';
  
  tbody.innerHTML = '';
  for (var i = 0; i < rows.length; i++) tbody.appendChild(rows[i]);
  if (totRow) tbody.appendChild(totRow);
  
  // Riattacca click handlers dopo il sort
  if (tblId === 'fv-tbl' && window._fvData) {
    bindFVRowClicks(tblId, window._fvData, window._fvIsItalia);
  } else if (tblId === 'main-tbl' && lastReport) {
    bindMainRowClicks(lastReport);
  }
}

function initResize(tblId) {
  var resizers = document.querySelectorAll('#' + tblId + ' .col-resize');
  for (var i = 0; i < resizers.length; i++) {
    (function(rz) {
      rz.addEventListener('mousedown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var th = rz.parentElement;
        var startX = e.pageX;
        var startW = th.offsetWidth;
        function onMove(ev) {
          var w = startW + (ev.pageX - startX);
          if (w > 60) th.style.width = w + 'px';
        }
        function onUp() {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    })(resizers[i]);
  }
}

function closeFV() {
  if (fvStack.length > 1) {
    // Sono dentro un sub-FV (es. cliente aperto da una lista FV) → torna alla FV precedente
    fvStack.pop();
    renderFV();
  } else {
    // Chiudo la FV completamente
    document.getElementById('fv').classList.remove('open');
    fvStack = [];
    
    // Se c'è uno snapshot della vista principale, ripristinala
    if (window._mainSnapshot && lastReport) {
      var snap = window._mainSnapshot;
      // Se lo snapshot corrisponde alla vista attualmente in lastReport, applicalo
      if (snap.vista === lastReport.vista) {
        applyMainTableSnapshot(lastReport);
      } else {
        // Vista cambiata (es. sono passato da Italia → cliente di un agente)
        // Imposta i filtri salvati e rigenera
        document.getElementById('vista').value = snap.vista;
        document.getElementById('periodo').value = snap.periodoMode;
        if (snap.meseDa) document.getElementById('mese-da').value = snap.meseDa;
        if (snap.meseA) document.getElementById('mese-a').value = snap.meseA;
        togglePeriodo();
        // applyMainTableSnapshot verrà chiamato da renderReport
        generaReport();
      }
    }
  }
}

function doSearch(q) {
  document.getElementById('search-clear').classList.toggle('show', q.length > 0);
  var sr = document.getElementById('search-results');
  if (!q || q.length < 2 || !D.length) { sr.style.display = 'none'; return; }
  
  var ql = q.toLowerCase();
  var cli = {}, ag = {};
  for (var i = 0; i < D.length; i++) {
    if (D[i].cliente.toLowerCase().indexOf(ql) !== -1) cli[D[i].cliente] = D[i].agente;
    if (D[i].agente.toLowerCase().indexOf(ql) !== -1) ag[D[i].agente] = true;
  }
  
  var cliKeys = Object.keys(cli);
  var agKeys = Object.keys(ag);
  
  if (!cliKeys.length && !agKeys.length) {
    sr.style.display = 'block';
    sr.innerHTML = '<p style="color:var(--muted);font-size:12px">Nessun risultato</p>';
    return;
  }
  
  var html = '';
  if (agKeys.length) {
    html += '<div class="sr-section">Agenti</div>';
    for (var i = 0; i < agKeys.length; i++) {
      var name = agKeys[i];
      html += '<div class="sr-item" data-type="agente" data-name="' + escapeHTML(name) + '"><strong>' + escapeHTML(name) + '</strong><div class="sr-meta">Agente</div></div>';
    }
  }
  if (cliKeys.length) {
    html += '<div class="sr-section" style="margin-top:12px">Clienti</div>';
    for (var i = 0; i < cliKeys.length; i++) {
      var name = cliKeys[i];
      html += '<div class="sr-item" data-type="cliente" data-name="' + escapeHTML(name) + '"><strong>' + escapeHTML(name) + '</strong><div class="sr-meta">' + escapeHTML(cli[name] || '') + '</div></div>';
    }
  }
  sr.innerHTML = html;
  sr.style.display = 'block';
  
  var items = sr.querySelectorAll('.sr-item');
  for (var i = 0; i < items.length; i++) {
    items[i].addEventListener('click', function() {
      var type = this.getAttribute('data-type');
      var name = this.getAttribute('data-name');
      if (type === 'agente') {
        // Salva snapshot se c'è già un report
        if (lastReport) {
          window._mainSnapshot = {
            vista: lastReport.vista,
            anno: lastReport.anno,
            periodoMode: document.getElementById('periodo').value,
            meseDa: document.getElementById('mese-da').value,
            meseA: document.getElementById('mese-a').value,
            domOrder: readTableOrder('main-tbl', lastReport.tutti),
            sortStates: JSON.parse(JSON.stringify(sortStates)),
            scrollY: document.querySelector('.content').scrollTop || 0
          };
        }
        document.getElementById('vista').value = name;
        generaReport();
        clearSearch();
      } else {
        // Salva snapshot prima di aprire scheda cliente
        if (lastReport) {
          window._mainSnapshot = {
            vista: lastReport.vista,
            anno: lastReport.anno,
            periodoMode: document.getElementById('periodo').value,
            meseDa: document.getElementById('mese-da').value,
            meseA: document.getElementById('mese-a').value,
            domOrder: readTableOrder('main-tbl', lastReport.tutti),
            sortStates: JSON.parse(JSON.stringify(sortStates)),
            scrollY: document.querySelector('.content').scrollTop || 0
          };
        } else {
          generaReport();
        }
        clearSearch();
        fvStack = [];
        showFV({ type: 'cliente', nome: name });
      }
    });
  }
}

// Legge l'ordine corrente delle righe della tabella nel DOM e restituisce i dati ordinati
function readTableOrder(tblId, sourceData) {
  var rows = document.querySelectorAll('#' + tblId + ' tbody tr:not(.tot-row)');
  if (!rows.length || !sourceData) return sourceData || [];
  var ordered = [];
  for (var i = 0; i < rows.length; i++) {
    var name = rows[i].cells[0].textContent.trim();
    for (var j = 0; j < sourceData.length; j++) {
      if (sourceData[j].nome === name) {
        ordered.push(sourceData[j]);
        break;
      }
    }
  }
  return ordered.length ? ordered : sourceData;
}

function exportClienteExcel(nome) {

// Callback per autoTable: colora di rosso le celle con valori negativi
function colorNegativesCallback(data) {
  if (data.section !== 'body') return;
  var txt = String(data.cell.raw || data.cell.text || '');
  if (typeof data.cell.raw === 'string') txt = data.cell.raw;
  else if (Array.isArray(data.cell.text)) txt = data.cell.text.join(' ');
  // Cerca segno meno all'inizio del valore numerico
  if (/^-[\d]/.test(txt.trim()) || /^-\d/.test(txt.trim())) {
    data.cell.styles.textColor = [185, 28, 28]; // var --red
  }
  // Verde per positivi con segno +
  else if (/^\+[\d]/.test(txt.trim())) {
    data.cell.styles.textColor = [21, 128, 61]; // var --green
  }
}

      var r25v = refs25[name] || { fatt: 0, btl: 0, btlEq: 0 };
      if (r26v.btlEq === 0 && r25v.btlEq === 0) continue;
      var dRef = r25v.btlEq > 0 ? ((r26v.btlEq - r25v.btlEq) / r25v.btlEq) * 100 : 0;
      var pctTot = b26Eq > 0 ? (r26v.btlEq / b26Eq) * 100 : 0;
      refRows.push([name, NUM(r26v.btlEq), NUM(r25v.btlEq), EURpdf(r26v.fatt), pctTot.toFixed(2).replace('.', ',') + '%', PCTsign(dRef)]);
    }
    if (refRows.length) {
      doc.autoTable({
        head: [['Referenza', 'Bott. ' + anno, 'Bott. ' + annoP, 'Fatturato', '% sul tot', 'Var %']],
        body: refRows, startY: y,
        theme: 'striped',
        headStyles: { fillColor: [114, 47, 55], textColor: 255, fontSize: 9 },
        bodyStyles: { fontSize: 9 },
        columnStyles: { 0: { fontStyle: 'bold' }, 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right' } },
        margin: { left: tableX, right: margin },
        didParseCell: colorNegativesCallback,
        tableWidth: tableW
      });
    }
  }
  
  // ============ SEZIONE 3: FATTURE (nuova pagina) ============
  if (arr.length) {
    doc.addPage('a4', 'landscape');
    drawHeader(doc, rFake, pageW);
    var yFat = 32;
    drawSectionTitle(doc, 'Fatture ' + anno + ' (' + arr.length + ')', margin, yFat);
    yFat += 5;
    
    var body = [];
    for (var i = 0; i < arr.length; i++) body.push([arr[i].data, arr[i].numDoc, NUM(arr[i].pezzi), NUM(arr[i].pezziEq), EURpdf(arr[i].importo)]);
    body.push(['TOTALE', '', NUM(b26), NUM(b26Eq), EURpdf(f26)]);
    
    doc.autoTable({
      head: [['Data', 'N. Doc', 'Bottiglie', 'Bott. equiv.', 'Importo']], body: body, startY: yFat,
      theme: 'striped',
      headStyles: { fillColor: [114, 47, 55], textColor: 255, fontSize: 9 },
      bodyStyles: { fontSize: 9 },
      columnStyles: { 2: { halign: 'right' }, 3: { halign: 'right' }, 4: { halign: 'right' } },
      margin: { left: margin, right: margin },
      didParseCell: function(data) {
        if (data.section === 'body' && data.row.index === body.length - 1) {
          data.cell.styles.fontStyle = 'bold';
          data.cell.styles.fillColor = [240, 230, 230];
        }
      }
    });
  }
  
  // Footer paginato
  addPageNumbers(doc, pageW, pageH);
  
  doc.save('Mosnel_Cliente_' + nome.substr(0,30).replace(/\s+/g, '_') + '.pdf');
}
